// ==================== roundRect Polyfill ====================
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    if (typeof r === 'number') r = { tl: r, tr: r, br: r, bl: r }
    this.beginPath()
    this.moveTo(x + r.tl, y)
    this.lineTo(x + w - r.tr, y)
    this.quadraticCurveTo(x + w, y, x + w, y + r.tr)
    this.lineTo(x + w, y + h - r.br)
    this.quadraticCurveTo(x + w, y + h, x + w - r.br, y + h)
    this.lineTo(x + r.bl, y + h)
    this.quadraticCurveTo(x, y + h, x, y + h - r.bl)
    this.lineTo(x, y + r.tl)
    this.quadraticCurveTo(x, y, x + r.tl, y)
    this.closePath()
    return this
  }
}


// ==================== utils/math.js ====================
// ==================== 数学工具函数 ====================

function distance(a, b) {
  const dx = a.x - b.x
  const dy = a.y - b.y
  return Math.sqrt(dx * dx + dy * dy)
}

function angleTo(from, to) {
  return Math.atan2(to.y - from.y, to.x - from.x)
}

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value))
}

function lerp(a, b, t) {
  return a + (b - a) * t
}

function randomRange(min, max) {
  return Math.random() * (max - min) + min
}

function randomInt(min, max) {
  return Math.floor(randomRange(min, max + 1))
}

function degToRad(deg) {
  return deg * (Math.PI / 180)
}

function vecFromAngle(angle, speed) {
  return { x: Math.cos(angle) * speed, y: Math.sin(angle) * speed }
}

// ==================== utils/storage.js ====================
// ==================== 本地存档工具 ====================
const SAVE_KEY = 'airplane_battle_save'

function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY)
    if (!raw) return getDefaultSave()
    return JSON.parse(raw)
  } catch {
    return getDefaultSave()
  }
}

function saveSave(data) {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(data))
  } catch {
    // 存储空间不足，静默失败
  }
}

function getDefaultSave() {
  return {
    coins: 0,
    maxLevelUnlocked: 1,
    unlockedWeapons: ['main'],
    unlockedSkills: ['bomb'],
    equippedSkills: ['bomb'],
    upgrades: { maxHp: 0, moveSpeed: 0, damage: 0, shieldRegen: 0 },
    highScores: {},
    settings: { bgmVolume: 0.5, sfxVolume: 0.8, vibrate: true, reducedFx: false },
    playCount: 0,
  }
}

function getMaxHp(save) {
  return 5 + (save.upgrades?.maxHp || 0)
}

function getMoveSpeed(save) {
  return 6 + (save.upgrades?.moveSpeed || 0) * 0.5
}

function getDamageBonus(save) {
  return 1 + (save.upgrades?.damage || 0) * 0.1
}

function getUpgradeCost(upgradeType, currentLevel) {
  const baseCosts = { maxHp: 100, moveSpeed: 80, damage: 120, shieldRegen: 150 }
  return (baseCosts[upgradeType] || 100) * (currentLevel + 1)
}

// ==================== core/EventSystem.js ====================
// ==================== 事件系统（发布/订阅） ====================
class EventSystem {
  constructor() {
    this._listeners = new Map()
  }

  on(event, callback) {
    if (!this._listeners.has(event)) {
      this._listeners.set(event, [])
    }
    this._listeners.get(event).push(callback)
  }

  off(event, callback) {
    const listeners = this._listeners.get(event)
    if (listeners) {
      const idx = listeners.indexOf(callback)
      if (idx !== -1) listeners.splice(idx, 1)
    }
  }

  emit(event, data) {
    const listeners = this._listeners.get(event)
    if (listeners) {
      for (const cb of listeners) {
        cb(data)
      }
    }
  }

  clear() {
    this._listeners.clear()
  }
}

// ==================== core/InputManager.js ====================
// ==================== 输入管理器 ====================
class InputManager {
  constructor(canvas) {
    this.canvas = canvas
    this.keys = {}
    this._prevKeys = {}
    this.mouseX = 0
    this.mouseY = 0
    this.isMouseDown = false
    this._isTouchDown = false
    this.touchX = 0
    this.touchY = 0
    this._touchStartX = 0
    this._touchStartY = 0
    this._playerStartX = 0
    this._playerStartY = 0
    this._relTouchDX = 0
    this._relTouchDY = 0
    this._usingTouch = false

    this._onKeyDown = (e) => {
      this.keys[e.key] = true
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown' ||
          e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault()
      }
    }
    this._onKeyUp = (e) => {
      this.keys[e.key] = false
    }
    this._onMouseMove = (e) => {
      const rect = canvas.getBoundingClientRect()
      const scaleX = canvas.width / rect.width
      const scaleY = canvas.height / rect.height
      this.mouseX = (e.clientX - rect.left) * scaleX
      this.mouseY = (e.clientY - rect.top) * scaleY
    }
    this._onMouseDown = (e) => {
      this.isMouseDown = true
      this.keys['click'] = true
    }
    this._onMouseUp = (e) => {
      this.isMouseDown = false
      this.keys['click'] = false
    }
    this._onTouchStart = (e) => {
      e.preventDefault()
      this._usingTouch = true
      this._isTouchDown = true
      this.keys['click'] = true
      this.keys['touch'] = true
      const touch = e.touches[0]
      const rect = canvas.getBoundingClientRect()
      this._touchStartX = touch.clientX
      this._touchStartY = touch.clientY
      this.touchX = (touch.clientX - rect.left) * (canvas.width / rect.width)
      this.touchY = (touch.clientY - rect.top) * (canvas.height / rect.height)
      this._relTouchDX = 0
      this._relTouchDY = 0
    }
    this._onTouchMove = (e) => {
      e.preventDefault()
      const touch = e.touches[0]
      const rect = canvas.getBoundingClientRect()
      this._touchStartX = touch.clientX
      this._touchStartY = touch.clientY
      this.touchX = (touch.clientX - rect.left) * (canvas.width / rect.width)
      this.touchY = (touch.clientY - rect.top) * (canvas.height / rect.height)
    }
    this._onTouchEnd = (e) => {
      e.preventDefault()
      this._isTouchDown = false
      this.keys['click'] = false
      this.keys['touch'] = false
    }

    window.addEventListener('keydown', this._onKeyDown)
    window.addEventListener('keyup', this._onKeyUp)
    canvas.addEventListener('mousemove', this._onMouseMove)
    canvas.addEventListener('mousedown', this._onMouseDown)
    canvas.addEventListener('mouseup', this._onMouseUp)
    canvas.addEventListener('touchstart', this._onTouchStart, { passive: false })
    canvas.addEventListener('touchmove', this._onTouchMove, { passive: false })
    canvas.addEventListener('touchend', this._onTouchEnd, { passive: false })
  }

  isKeyDown(key) {
    return !!this.keys[key]
  }

  isKeyPressed(key) {
    return !!this.keys[key] && !this._prevKeys[key]
  }

  isTouchActive() {
    return this._isTouchDown || this._usingTouch
  }

  getPlayerInput(playerX, playerY) {
    if (this._usingTouch && this._isTouchDown) {
      return {
        dx: this.touchX - playerX,
        dy: this.touchY - playerY,
        fire: true,
        usingTouch: true,
      }
    }
    return {
      dx: (this.keys['ArrowRight'] ? 1 : 0) - (this.keys['ArrowLeft'] ? 1 : 0),
      dy: (this.keys['ArrowDown'] ? 1 : 0) - (this.keys['ArrowUp'] ? 1 : 0),
      fire: this.keys[' '] || this.isMouseDown,
      usingTouch: false,
    }
  }

  update() {
    this._prevKeys = { ...this.keys }
  }

  destroy() {
    window.removeEventListener('keydown', this._onKeyDown)
    window.removeEventListener('keyup', this._onKeyUp)
    this.canvas.removeEventListener('mousemove', this._onMouseMove)
    this.canvas.removeEventListener('mousedown', this._onMouseDown)
    this.canvas.removeEventListener('mouseup', this._onMouseUp)
    this.canvas.removeEventListener('touchstart', this._onTouchStart)
    this.canvas.removeEventListener('touchmove', this._onTouchMove)
    this.canvas.removeEventListener('touchend', this._onTouchEnd)
  }
}

// ==================== core/Camera.js ====================
// ==================== 摄像机（震动/平移） ====================

class Camera {
  constructor() {
    this.x = 0
    this.y = 0
    this.shakeX = 0
    this.shakeY = 0
    this.shakeDuration = 0
    this.shakeIntensity = 0
    this.shakeTimer = 0
  }

  shake(intensity = 8, duration = 0.2) {
    this.shakeIntensity = intensity
    this.shakeDuration = duration
    this.shakeTimer = 0
  }

  update(dt) {
    if (this.shakeTimer < this.shakeDuration) {
      this.shakeTimer += dt
      const progress = this.shakeTimer / this.shakeDuration
      const decay = 1 - progress
      this.shakeX = (Math.random() * 2 - 1) * this.shakeIntensity * decay
      this.shakeY = (Math.random() * 2 - 1) * this.shakeIntensity * decay
    } else {
      this.shakeX = 0
      this.shakeY = 0
    }
  }

  get offsetX() {
    return this.x + this.shakeX
  }

  get offsetY() {
    return this.y + this.shakeY
  }

  reset() {
    this.x = 0
    this.y = 0
    this.shakeX = 0
    this.shakeY = 0
    this.shakeDuration = 0
    this.shakeTimer = 0
  }
}

// ==================== core/ParticleSystem.js ====================
// ==================== 粒子特效系统 ====================

class Particle {
  constructor(x, y, config) {
    this.x = x
    this.y = y
    this.vx = config.vx || randomRange(-2, 2)
    this.vy = config.vy || randomRange(-2, 2)
    this.life = config.life || 1
    this.maxLife = this.life
    this.color = config.color || '#ffffff'
    this.size = config.size || randomRange(2, 5)
    this.gravity = config.gravity || 0
    this.friction = config.friction || 0.98
    this.active = true
  }

  update(dt) {
    this.life -= dt
    if (this.life <= 0) {
      this.active = false
      return
    }
    this.vx *= this.friction
    this.vy *= this.friction
    this.vy += this.gravity * dt
    this.x += this.vx * 60 * dt
    this.y += this.vy * 60 * dt
  }

  render(ctx) {
    const alpha = Math.max(0, this.life / this.maxLife)
    ctx.globalAlpha = alpha
    ctx.fillStyle = this.color
    ctx.fillRect(this.x - this.size / 2, this.y - this.size / 2, this.size, this.size)
    ctx.globalAlpha = 1
  }
}

class ParticleSystem {
  constructor(maxParticles = 500) {
    this.particles = []
    this.maxParticles = maxParticles
  }

  emit(x, y, count, config) {
    for (let i = 0; i < count; i++) {
      if (this.particles.length >= this.maxParticles) return
      const angle = config.angle || randomRange(0, Math.PI * 2)
      const speed = config.speed || randomRange(1, 4)
      const v = vecFromAngle(angle, speed)
      this.particles.push(new Particle(x, y, {
        vx: v.x,
        vy: v.y,
        life: config.life || 0.5 + Math.random() * 0.5,
        color: config.color || '#ffffff',
        size: config.size || randomRange(2, 5),
        gravity: config.gravity || 0,
        friction: config.friction || 0.98,
      }))
    }
  }

  emitExplosion(x, y, size = 30) {
    const colors = ['#ff4444', '#ff8800', '#ffdd00', '#ffffff']
    this.emit(x, y, size * 0.5, {
      speed: randomRange(2, 6),
      life: 0.3 + Math.random() * 0.5,
      color: colors[Math.floor(Math.random() * colors.length)],
      size: randomRange(2, 6),
      friction: 0.95,
    })
    this.emit(x, y, size * 0.3, {
      speed: randomRange(1, 3),
      life: 0.5 + Math.random() * 0.5,
      color: '#ffdd00',
      size: randomRange(3, 8),
      friction: 0.96,
    })
  }

  update(dt) {
    for (let i = this.particles.length - 1; i >= 0; i--) {
      this.particles[i].update(dt)
      if (!this.particles[i].active) {
        this.particles[i] = this.particles[this.particles.length - 1]
        this.particles.pop()
      }
    }
  }

  render(ctx) {
    for (const p of this.particles) {
      p.render(ctx)
    }
  }

  clear() {
    this.particles = []
  }
}

// ==================== core/CollisionDetector.js ====================
// ==================== 碰撞检测 ====================
class CollisionDetector {
  static aabb(a, b) {
    const aw = a.width || a.size?.w || a.radius * 2 || 20
    const ah = a.height || a.size?.h || a.radius * 2 || 20
    const bw = b.width || b.size?.w || b.radius * 2 || 20
    const bh = b.height || b.size?.h || b.radius * 2 || 20
    return (
      a.x < b.x + bw &&
      a.x + aw > b.x &&
      a.y < b.y + bh &&
      a.y + ah > b.y
    )
  }

  static circle(a, b) {
    const ar = a.radius || (a.size ? Math.min(a.size.w, a.size.h) / 2 : 10)
    const br = b.radius || (b.size ? Math.min(b.size.w, b.size.h) / 2 : 10)
    const dx = a.x - b.x
    const dy = a.y - b.y
    const r = ar + br
    return dx * dx + dy * dy < r * r
  }
}

// 四叉树用于空间分区碰撞检测
class QuadTree {
  constructor(x, y, w, h, capacity = 8) {
    this.bounds = { x, y, w, h }
    this.capacity = capacity
    this.entities = []
    this.divided = false
    this.nw = null
    this.ne = null
    this.sw = null
    this.se = null
  }

  insert(entity) {
    if (!this._contains(entity)) return false
    if (this.entities.length < this.capacity) {
      this.entities.push(entity)
      return true
    }
    if (!this.divided) this._subdivide()
    return this.nw.insert(entity) || this.ne.insert(entity) ||
           this.sw.insert(entity) || this.se.insert(entity)
  }

  query(range, found = []) {
    if (!this._intersects(range)) return found
    for (const e of this.entities) {
      if (CollisionDetector.aabb(range, e)) found.push(e)
    }
    if (this.divided) {
      this.nw.query(range, found)
      this.ne.query(range, found)
      this.sw.query(range, found)
      this.se.query(range, found)
    }
    return found
  }

  clear() {
    this.entities = []
    this.divided = false
    this.nw = this.ne = this.sw = this.se = null
  }

  _contains(entity) {
    const ex = entity.x
    const ey = entity.y
    const ew = entity.width || entity.size?.w || 20
    const eh = entity.height || entity.size?.h || 20
    return ex >= this.bounds.x && ex + ew <= this.bounds.x + this.bounds.w &&
           ey >= this.bounds.y && ey + eh <= this.bounds.y + this.bounds.h
  }

  _intersects(range) {
    const rx = range.x || 0
    const ry = range.y || 0
    const rw = range.width || range.size?.w || 20
    const rh = range.height || range.size?.h || 20
    return !(rx > this.bounds.x + this.bounds.w || rx + rw < this.bounds.x ||
             ry > this.bounds.y + this.bounds.h || ry + rh < this.bounds.y)
  }

  _subdivide() {
    const { x, y, w, h } = this.bounds
    const hw = w / 2
    const hh = h / 2
    this.nw = new QuadTree(x, y, hw, hh, this.capacity)
    this.ne = new QuadTree(x + hw, y, hw, hh, this.capacity)
    this.sw = new QuadTree(x, y + hh, hw, hh, this.capacity)
    this.se = new QuadTree(x + hw, y + hh, hw, hh, this.capacity)
    this.divided = true
  }
}

// ==================== core/AssetLoader.js ====================
// ==================== 资源加载器 ====================
class AssetLoader {
  constructor() {
    this.images = new Map()
    this.audios = new Map()
    this.total = 0
    this.loaded = 0
  }

  get progress() {
    return this.total === 0 ? 1 : this.loaded / this.total
  }

  async loadAll(manifest) {
    this.total = 0
    this.loaded = 0
    const tasks = []

    if (manifest.images) {
      for (const [key, src] of Object.entries(manifest.images)) {
        this.total++
        tasks.push(this._loadImage(key, src))
      }
    }
    if (manifest.audios) {
      for (const [key, src] of Object.entries(manifest.audios)) {
        this.total++
        tasks.push(this._loadAudio(key, src))
      }
    }

    if (tasks.length === 0) return
    await Promise.all(tasks)
  }

  async _loadImage(key, src) {
    return new Promise((resolve) => {
      const img = new Image()
      img.onload = () => {
        this.images.set(key, img)
        this.loaded++
        resolve()
      }
      img.onerror = () => {
        this.loaded++
        resolve() // 失败不影响整体
      }
      img.src = src
    })
  }

  async _loadAudio(key, src) {
    return new Promise((resolve) => {
      const audio = new Audio()
      audio.oncanplaythrough = () => {
        this.audios.set(key, audio)
        this.loaded++
        resolve()
      }
      audio.onerror = () => {
        this.loaded++
        resolve()
      }
      audio.src = src
    })
  }

  getImage(key) {
    return this.images.get(key)
  }

  getAudio(key) {
    return this.audios.get(key)
  }
}

// ==================== core/SceneManager.js ====================
// ==================== 场景管理器 ====================
class SceneManager {
  constructor(game) {
    this.game = game
    this.currentScene = null
    this.scenes = new Map()
  }

  register(name, SceneClass) {
    this.scenes.set(name, SceneClass)
  }

  switchTo(name, params = {}) {
    if (this.scenes.has(name)) {
      if (this.currentScene && this.currentScene.destroy) {
        this.currentScene.destroy()
      }
      const SceneClass = this.scenes.get(name)
      this.currentScene = new SceneClass(this.game, params)
      this.currentSceneName = name
      if (this.currentScene.init) {
        this.currentScene.init()
      }
    }
  }

  update(dt) {
    if (this.currentScene && this.currentScene.update) {
      this.currentScene.update(dt)
    }
  }

  render(ctx) {
    if (this.currentScene && this.currentScene.render) {
      this.currentScene.render(ctx)
    }
  }
}

// ==================== core/Game.js ====================
// ==================== 游戏主循环 ====================

class Game {
  constructor(canvas) {
    this.canvas = canvas
    this.ctx = canvas.getContext('2d')
    canvas.width = GAME_WIDTH
    canvas.height = GAME_HEIGHT

    this.events = new EventSystem()
    this.input = new InputManager(canvas)
    this.scenes = new SceneManager(this)
    this.assets = new AssetLoader()
    this.camera = new Camera()
    this.particles = new ParticleSystem(500)

    this.lastTime = 0
    this.fps = 0
    this._frameCount = 0
    this._fpsTimer = 0
    this._running = false
    this.paused = false

    // 全局时间缩放（用于慢动作技能）
    this.timeScale = 1
  }

  async init() {
    // 注册场景（延迟导入避免循环依赖）
    // 动态导入已移除: MenuScene 已在全局作用域
    // 动态导入已移除: BattleScene 已在全局作用域
    // 动态导入已移除: ShopScene 已在全局作用域
    // 动态导入已移除: ResultScene 已在全局作用域

    this.scenes.register('menu', MenuScene)
    this.scenes.register('battle', BattleScene)
    this.scenes.register('shop', ShopScene)
    this.scenes.register('result', ResultScene)

    this.scenes.switchTo('menu')
  }

  start() {
    this._running = true
    this.lastTime = performance.now()
    this._loop(this.lastTime)
  }

  _loop(timestamp) {
    if (!this._running) return

    const rawDt = (timestamp - this.lastTime) / 1000
    this.lastTime = timestamp

    // 固定时间步长，防止帧率波动影响物理
    const dt = Math.min(rawDt, 1 / 30) * this.timeScale

    // FPS 统计
    this._frameCount++
    this._fpsTimer += rawDt
    if (this._fpsTimer >= 1) {
      this.fps = this._frameCount
      this._frameCount = 0
      this._fpsTimer -= 1
    }

    // 暂停/恢复 - 在主循环中处理，确保始终响应
    if (this.input.isKeyPressed('Escape') || this.input.isKeyPressed('p')) {
      this.paused = !this.paused
    }

    if (!this.paused) {
      this.update(dt)
    }
    this.render()

    this.input.update()
    requestAnimationFrame((t) => this._loop(t))
  }

  update(dt) {
    this.camera.update(dt)
    this.scenes.update(dt)
  }

  render() {
    const ctx = this.ctx
    ctx.save()
    ctx.translate(this.camera.offsetX, this.camera.offsetY)
    this.scenes.render(ctx)
    this.particles.render(ctx)
    ctx.restore()

    // 暂停蒙层
    if (this.paused) {
      ctx.fillStyle = 'rgba(0,0,0,0.5)'
      ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT)
      ctx.fillStyle = '#ffffff'
      ctx.font = 'bold 36px Orbitron'
      ctx.textAlign = 'center'
      ctx.fillText('PAUSED', GAME_WIDTH / 2, GAME_HEIGHT / 2 - 20)
      ctx.font = '16px Orbitron'
      ctx.fillText('按 ESC 继续', GAME_WIDTH / 2, GAME_HEIGHT / 2 + 30)
    }
  }
}

// ==================== scenes/StarField.js ====================
// ==================== 星星背景（所有场景复用） ====================

class StarField {
  constructor(layers = 3) {
    this.layers = []
    for (let i = 0; i < layers; i++) {
      const stars = []
      const count = 30 + i * 20
      for (let j = 0; j < count; j++) {
        stars.push({
          x: Math.random() * GAME_WIDTH,
          y: Math.random() * GAME_HEIGHT,
          size: 0.5 + i * 0.5,
          speed: 0.3 + i * 0.5,
          brightness: 0.3 + Math.random() * 0.7,
        })
      }
      this.layers.push(stars)
    }
    this.nebulaColors = ['rgba(0,50,100,0.05)', 'rgba(50,0,80,0.05)', 'rgba(0,80,50,0.05)']
  }

  update(dt) {
    for (const layer of this.layers) {
      for (const star of layer) {
        star.y += star.speed * 60 * dt
        if (star.y > GAME_HEIGHT + 5) {
          star.y = -5
          star.x = Math.random() * GAME_WIDTH
        }
      }
    }
  }

  render(ctx) {
    // 背景
    ctx.fillStyle = '#0a0a1a'
    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT)

    // 星云
    ctx.fillStyle = this.nebulaColors[0]
    ctx.beginPath()
    ctx.arc(100, 200, 150, 0, Math.PI * 2)
    ctx.fill()
    ctx.fillStyle = this.nebulaColors[1]
    ctx.beginPath()
    ctx.arc(380, 500, 180, 0, Math.PI * 2)
    ctx.fill()
    ctx.fillStyle = this.nebulaColors[2]
    ctx.beginPath()
    ctx.arc(240, 350, 120, 0, Math.PI * 2)
    ctx.fill()

    // 星星
    for (const layer of this.layers) {
      for (const star of layer) {
        ctx.fillStyle = `rgba(255,255,255,${star.brightness})`
        ctx.fillRect(star.x, star.y, star.size, star.size)
      }
    }
  }
}

// ==================== entities/Entity.js ====================
// ==================== 实体基类 ====================
class Entity {
  constructor(x, y, config = {}) {
    this.x = x
    this.y = y
    this.width = config.width || config.size?.w || 32
    this.height = config.height || config.size?.h || 32
    this.size = config.size || { w: this.width, h: this.height }
    this.color = config.color || '#ffffff'
    this.active = true
    this.visible = true
    this.tag = 'entity'
  }

  update(dt) { /* 子类实现 */ }

  render(ctx) {
    if (!this.active || !this.visible) return
    ctx.fillStyle = this.color
    ctx.fillRect(
      this.x - this.size.w / 2,
      this.y - this.size.h / 2,
      this.size.w,
      this.size.h
    )
  }

  destroy() {
    this.active = false
  }

  get bounds() {
    return {
      x: this.x - this.size.w / 2,
      y: this.y - this.size.h / 2,
      width: this.size.w,
      height: this.size.h,
    }
  }
}

// ==================== entities/Bullet.js ====================
// ==================== 子弹实体 ====================

class Bullet extends Entity {
  constructor(config) {
    super(config.x, config.y, {
      size: { w: config.radius * 2 || 6, h: config.radius * 2 || 6 },
    })
    this.vx = config.vx || 0
    this.vy = config.vy || 0
    this.damage = config.damage || 1
    this.radius = config.radius || 3
    this.tag = config.tag || 'bullet'
    this.color = config.color || '#ffffff'
    this.tracking = config.tracking || false
    this.trackingTarget = null
    this.trackingSpeed = 3
    this.pierce = config.pierce || false
    this.aoe = config.aoe || 0
    this.duration = config.duration || 0
    this.timer = 0
    this.fromPlayer = config.tag === 'player_bullet'
  }

  update(dt) {
    this.timer += dt

    if (this.tracking && this.trackingTarget) {
      const angle = angleTo(this, this.trackingTarget)
      const v = vecFromAngle(angle, this.trackingSpeed)
      this.vx = v.x
      this.vy = v.y
    }

    this.x += this.vx * 60 * dt
    this.y += this.vy * 60 * dt

    // 出界销毁
    if (this.y < -50 || this.y > GAME_HEIGHT + 50 || this.x < -50 || this.x > 530) {
      this.active = false
    }

    // 持续时间到期
    if (this.duration > 0 && this.timer >= this.duration) {
      this.active = false
    }
  }

  render(ctx) {
    if (!this.active) return

    ctx.save()
    ctx.fillStyle = this.color
    ctx.shadowColor = this.color
    ctx.shadowBlur = 6

    if (this.tag === 'player_bullet') {
      // 玩家子弹 - 发光椭圆
      ctx.beginPath()
      ctx.ellipse(this.x, this.y, this.radius, this.radius * 2, 0, 0, Math.PI * 2)
      ctx.fill()
      ctx.fillStyle = '#ffffff'
      ctx.beginPath()
      ctx.ellipse(this.x, this.y, this.radius * 0.5, this.radius, 0, 0, Math.PI * 2)
      ctx.fill()
    } else {
      // 敌方子弹 - 圆形
      ctx.beginPath()
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2)
      ctx.fill()
      ctx.fillStyle = '#ffffff'
      ctx.beginPath()
      ctx.arc(this.x, this.y, this.radius * 0.4, 0, Math.PI * 2)
      ctx.fill()
    }

    ctx.restore()
  }

  get bounds() {
    return {
      x: this.x - this.radius,
      y: this.y - this.radius,
      width: this.radius * 2,
      height: this.radius * 2,
    }
  }
}

// ==================== entities/PowerUp.js ====================
// ==================== 道具实体 ====================

class PowerUp extends Entity {
  constructor(x, y, type) {
    const config = powerupTypes[type]
    super(x, y, {
      size: { w: config.size, h: config.size },
      color: config.color,
    })
    this.tag = 'powerup'
    this.powerupType = type
    this.effect = config.effect
    this.value = config.value
    this.fallSpeed = config.fallSpeed || 2
    this.attractSpeed = 0
    this.timer = 0
    this.pulseTimer = 0
  }

  update(dt, player) {
    this.timer += dt
    this.pulseTimer += dt
    this.y += this.fallSpeed * 60 * dt

    // 向玩家吸附
    if (player && player.alive) {
      const dx = player.x - this.x
      const dy = player.y - this.y
      const dist = Math.sqrt(dx * dx + dy * dy)
      if (dist < 120) {
        this.attractSpeed = Math.min(this.attractSpeed + dt * 20, 6)
        this.x += (dx / dist) * this.attractSpeed * 60 * dt
        this.y += (dy / dist) * this.attractSpeed * 60 * dt
      }
    }

    if (this.y > GAME_HEIGHT + 50) {
      this.active = false
    }
  }

  render(ctx) {
    if (!this.active) return

    const pulse = 1 + Math.sin(this.pulseTimer * 5) * 0.2
    const size = this.size.w * pulse

    ctx.save()
    ctx.translate(this.x, this.y)

    // 外发光
    ctx.shadowColor = this.color
    ctx.shadowBlur = 10 + Math.sin(this.pulseTimer * 3) * 5

    // 道具图标形状
    ctx.fillStyle = this.color
    ctx.strokeStyle = '#ffffff'
    ctx.lineWidth = 1.5

    const halfSize = size / 2
    ctx.beginPath()
    ctx.moveTo(0, -halfSize)
    ctx.lineTo(halfSize * 0.7, 0)
    ctx.lineTo(0, halfSize)
    ctx.lineTo(-halfSize * 0.7, 0)
    ctx.closePath()
    ctx.fill()
    ctx.stroke()

    ctx.restore()
  }
}

// ==================== entities/Player.js ====================
// ==================== 玩家战机 ====================

// 皮肤配置
const SKINS = {
  cyan:   { primary: '#00f0ff', secondary: '#1a2a4a', accent: '#0088ff' },
  red:    { primary: '#ff4444', secondary: '#2a1a1a', accent: '#ff8844' },
  green:  { primary: '#00ff66', secondary: '#1a2a1a', accent: '#00aa44' },
  gold:   { primary: '#ffdd00', secondary: '#2a2a1a', accent: '#ffaa00' },
  purple: { primary: '#ff00ff', secondary: '#2a1a2a', accent: '#cc44ff' },
}

class Player extends Entity {
  constructor(game, save) {
    super(GAME_WIDTH / 2, GAME_HEIGHT - 100, {
      size: { w: 40, h: 48 },
      color: '#00f0ff',
    })
    this.game = game
    this.save = save
    this.tag = 'player'

    this.maxHp = getMaxHp(save)
    this.hp = this.maxHp
    this.shield = 0
    this.maxShield = 3
    this.moveSpeed = getMoveSpeed(save)
    this.damageBonus = getDamageBonus(save)
    this.weaponLevel = 1
    this.maxWeaponLevel = 5
    this.activeWeapon = 'main'
    this.fireTimer = 0
    this.invincibleTimer = 0
    this.invincibleTime = PLAYER_DEFAULTS.invincibleTime

    // 皮肤
    this.skinId = save.selectedSkin || 'cyan'
    this.skin = SKINS[this.skinId] || SKINS['cyan']

    // 技能状态
    this.skills = save.equippedSkills || ['bomb']
    this.skillCooldowns = {}
    for (const skillId of this.skills) {
      this.skillCooldowns[skillId] = 0
    }

    // 僚机
    this.drones = []

    // 引擎尾焰粒子计时
    this.engineTimer = 0

    this.alive = true
    this.levelDir = 0 // 移动方向
  }

  init() {
    this.hp = this.maxHp
    this.shield = 0
    this.weaponLevel = 1
    this.fireTimer = 0
    this.invincibleTimer = 0
    this.alive = true
    this.drones = []
    for (const skillId of this.skills) {
      this.skillCooldowns[skillId] = 0
    }
  }

  update(dt, input) {
    if (!this.alive) return

    // 移动
    const { dx, dy, fire, usingTouch } = this.game.input.getPlayerInput(this.x, this.y)
    let moveX = dx
    let moveY = dy

    if (usingTouch) {
      // 触摸模式：向触摸点移动
      const dist = Math.sqrt(moveX * moveX + moveY * moveY)
      if (dist > 5) {
        const normX = moveX / dist
        const normY = moveY / dist
        moveX = normX
        moveY = normY
      } else {
        moveX = 0
        moveY = 0
      }
    }

    this.x += moveX * this.moveSpeed * 60 * dt
    this.y += moveY * this.moveSpeed * 60 * dt

    // 边界限制
    const halfW = this.size.w / 2
    const halfH = this.size.h / 2
    this.x = clamp(this.x, halfW, GAME_WIDTH - halfW)
    this.y = clamp(this.y, halfH, GAME_HEIGHT - halfH)

    this.levelDir = moveX

    // 射击
    if (fire) {
      this.fireTimer -= dt
      if (this.fireTimer <= 0) {
        this._fire()
        const weapon = weaponConfig[this.activeWeapon]
        const level = weapon.levels[Math.min(this.weaponLevel - 1, weapon.levels.length - 1)]
        this.fireTimer = level.fireRate
      }
    } else {
      this.fireTimer = Math.max(0, this.fireTimer)
    }

    // 无敌计时
    if (this.invincibleTimer > 0) {
      this.invincibleTimer -= dt
    }

    // 技能冷却
    for (const skillId of this.skills) {
      if (this.skillCooldowns[skillId] > 0) {
        this.skillCooldowns[skillId] -= dt
      }
    }

    // 引擎粒子
    this.engineTimer += dt
    if (this.engineTimer > 0.05) {
      this.engineTimer = 0
      this.game.particles.emit(this.x, this.y + this.size.h / 2, 1, {
        speed: 1.5,
        life: 0.3,
        color: this.skin.primary,
        size: 4,
        gravity: 0.5,
        angle: Math.PI / 2,
      })
    }

    // 僚机更新
    for (const drone of this.drones) {
      if (drone.timer > 0) {
        drone.timer -= dt
        drone.offsetAngle += dt * 3
        drone.x = this.x + Math.cos(drone.offsetAngle) * 50
        drone.y = this.y + Math.sin(drone.offsetAngle) * 20
        drone.fireTimer -= dt
        if (drone.fireTimer <= 0) {
          drone.fireTimer = 0.3
          this.game.events.emit('player_bullet', {
            x: drone.x,
            y: drone.y - 10,
            vx: 0,
            vy: -10,
            damage: 1 * this.damageBonus,
            color: '#ffdd00',
            radius: 3,
            tag: 'player_bullet',
          })
        }
      } else {
        drone.active = false
      }
    }
    this.drones = this.drones.filter(d => d.active)
  }

  _fire() {
    const weapon = weaponConfig[this.activeWeapon]
    const level = weapon.levels[Math.min(this.weaponLevel - 1, weapon.levels.length - 1)]
    const count = level.bulletCount || 1
    const spread = level.spread || 0
    const baseDamage = (level.damage || 1) * this.damageBonus

    for (let i = 0; i < count; i++) {
      const offset = (i - (count - 1) / 2) * spread
      const angle = -Math.PI / 2 + offset
      const vx = Math.cos(angle) * weapon.bulletSpeed
      const vy = Math.sin(angle) * weapon.bulletSpeed

      this.game.events.emit('player_bullet', {
        x: this.x + offset * 15,
        y: this.y - this.size.h / 2,
        vx: vx,
        vy: vy,
        damage: baseDamage,
        color: weapon.bulletColor || '#00f0ff',
        radius: 3,
        tag: 'player_bullet',
        tracking: weapon.tracking || false,
        pierce: weapon.pierce || false,
        aoe: weapon.aoe || 0,
        duration: weapon.duration || 0,
      })
    }
  }

  takeDamage(amount) {
    if (this.invincibleTimer > 0 || !this.alive) return false

    if (this.shield > 0) {
      this.shield -= amount
      if (this.shield < 0) {
        this.hp += this.shield
        this.shield = 0
      }
      this.game.camera.shake(3, 0.1)
      return true
    }

    this.hp -= amount
    this.invincibleTimer = this.invincibleTime
    this.game.camera.shake(6, 0.2)

    if (this.hp <= 0) {
      this.hp = 0
      this.alive = false
      this.game.events.emit('player_death')
    }
    return true
  }

  heal(amount) {
    this.hp = Math.min(this.maxHp, this.hp + amount)
  }

  addShield(amount) {
    this.shield = Math.min(this.maxShield, this.shield + amount)
  }

  upgradeWeapon() {
    if (this.weaponLevel < this.maxWeaponLevel) {
      this.weaponLevel++
    }
  }

  useSkill(skillId) {
    if (this.skillCooldowns[skillId] > 0) return false
    const config = skillConfig[skillId]
    if (!config) return false
    this.skillCooldowns[skillId] = config.cooldown
    this.game.events.emit('skill_used', { skillId, config })
    return true
  }

  render(ctx) {
    if (!this.alive) return
    // 无敌闪烁
    if (this.invincibleTimer > 0 && Math.floor(this.invincibleTimer * 10) % 2 === 0) return

    const { x, y } = this
    const skin = this.skin

    ctx.save()
    ctx.translate(x, y)

    // 引擎尾焰
    const gradient = ctx.createLinearGradient(0, 10, 0, 30)
    gradient.addColorStop(0, skin.primary)
    gradient.addColorStop(0.5, skin.accent)
    gradient.addColorStop(1, 'transparent')
    ctx.fillStyle = gradient
    ctx.beginPath()
    ctx.moveTo(-8, 12)
    ctx.lineTo(8, 12)
    ctx.lineTo(2, 28)
    ctx.lineTo(-2, 28)
    ctx.closePath()
    ctx.fill()

    // 机身
    ctx.fillStyle = skin.secondary
    ctx.strokeStyle = skin.primary
    ctx.lineWidth = 2
    ctx.shadowColor = skin.primary
    ctx.shadowBlur = 6
    ctx.beginPath()
    ctx.moveTo(0, -22)
    ctx.lineTo(10, 8)
    ctx.lineTo(4, 14)
    ctx.lineTo(-4, 14)
    ctx.lineTo(-10, 8)
    ctx.closePath()
    ctx.fill()
    ctx.stroke()
    ctx.shadowBlur = 0

    // 座舱
    ctx.fillStyle = skin.primary
    ctx.beginPath()
    ctx.ellipse(0, -2, 4, 8, 0, 0, Math.PI * 2)
    ctx.fill()

    // 机翼
    ctx.fillStyle = '#0d1a33'
    ctx.strokeStyle = skin.accent
    ctx.lineWidth = 1.5
    ctx.beginPath()
    ctx.moveTo(-5, -8)
    ctx.lineTo(-18, 4)
    ctx.lineTo(-10, 6)
    ctx.lineTo(-3, -2)
    ctx.closePath()
    ctx.fill()
    ctx.stroke()
    ctx.beginPath()
    ctx.moveTo(5, -8)
    ctx.lineTo(18, 4)
    ctx.lineTo(10, 6)
    ctx.lineTo(3, -2)
    ctx.closePath()
    ctx.fill()
    ctx.stroke()

    // 护盾光环
    if (this.shield > 0) {
      ctx.strokeStyle = 'rgba(85, 170, 255, 0.6)'
      ctx.lineWidth = 3
      ctx.beginPath()
      ctx.arc(0, 0, 28, 0, Math.PI * 2)
      ctx.stroke()
    }

    ctx.restore()

    // 渲染僚机
    for (const drone of this.drones) {
      if (!drone.active) continue
      this._drawMiniPlane(ctx, drone.x, drone.y, '#ffdd00', '#ff6600', 0.6)
    }
  }

  _drawMiniPlane(ctx, x, y, primary, accent, scale) {
    ctx.save()
    ctx.translate(x, y)
    ctx.scale(scale, scale)

    ctx.fillStyle = primary
    ctx.strokeStyle = accent
    ctx.lineWidth = 1.5
    ctx.beginPath()
    ctx.moveTo(0, -12)
    ctx.lineTo(6, 4)
    ctx.lineTo(2, 8)
    ctx.lineTo(-2, 8)
    ctx.lineTo(-6, 4)
    ctx.closePath()
    ctx.fill()
    ctx.stroke()

    ctx.fillStyle = accent
    ctx.beginPath()
    ctx.ellipse(0, -1, 2, 5, 0, 0, Math.PI * 2)
    ctx.fill()

    ctx.restore()
  }
}

// ==================== entities/enemies/Enemy.js ====================
// ==================== 敌机基类 ====================

class Enemy extends Entity {
  constructor(x, y, type, game) {
    const config = enemyConfig[type]
    super(x, y, { size: config.size, color: config.color })
    this.game = game
    this.enemyType = type
    this.config = config
    this.tag = 'enemy'
    this.hp = config.hp
    this.maxHp = config.hp
    this.speed = config.speed
    this.score = config.score
    this.behavior = config.behavior
    this.firePattern = config.firePattern
    this.fireInterval = config.fireInterval
    this.fireTimer = config.fireInterval * 0.5
    this.bulletSpeed = config.bulletSpeed || 0
    this.bulletColor = config.bulletColor || '#ff4444'
    this.bulletCount = config.bulletCount || 1
    this.dropTable = config.dropTable || []
    this.hasShield = config.hasShield || false
    this.shieldHp = config.shieldHp || 0
    this.maxShieldHp = config.shieldHp || 0
    this.explosionRadius = config.explosionRadius || 0
    this.explosionDamage = config.explosionDamage || 0
    this.stealthInterval = config.stealthInterval || 0
    this.stealthDuration = config.stealthDuration || 0
    this.stealthTimer = 0
    this.isStealth = false
    this.laserDuration = config.laserDuration || 0
    this.isLaserOn = false
    this.laserTimer = 0

    // 行为状态
    this.behaviorTimer = 0
    this.behaviorDir = 1
    this.hoverY = y
    this.hoverTimer = 0
    this.flashTimer = 0
    this.visible = true
  }

  update(dt) {
    this.behaviorTimer += dt
    this.fireTimer -= dt
    this.flashTimer -= dt

    // 隐身处理
    if (this.stealthInterval > 0) {
      this.stealthTimer += dt
      if (this.isStealth && this.stealthTimer >= this.stealthDuration) {
        this.isStealth = false
        this.stealthTimer = 0
      } else if (!this.isStealth && this.stealthTimer >= this.stealthInterval) {
        this.isStealth = true
        this.stealthTimer = 0
      }
    }

    switch (this.behavior) {
      case 'straight':
        this.y += this.speed * 60 * dt
        break
      case 'zigzag':
        this.y += this.speed * 0.8 * 60 * dt
        this.x += Math.sin(this.behaviorTimer * 3) * 2 * 60 * dt
        break
      case 'slow_straight':
        this.y += this.speed * 60 * dt
        break
      case 'track_player':
        this.y += this.speed * 60 * dt
        if (this.game.player && this.game.player.alive) {
          const dx = this.game.player.x - this.x
          if (Math.abs(dx) > 5) {
            this.x += Math.sign(dx) * 2 * 60 * dt
          }
        }
        break
      case 'hover':
        this.y += this.speed * 0.5 * 60 * dt
        this.hoverTimer += dt
        this.x += Math.sin(this.hoverTimer * 2) * 1.5 * 60 * dt
        if (this.hoverTimer > 2) {
          this.fireTimer = 0
        }
        break
      case 'formation':
        this.y += this.speed * 60 * dt
        this.x += Math.sin(this.behaviorTimer * 1.5) * 1 * 60 * dt
        break
      case 'stealth':
        this.y += this.speed * 0.7 * 60 * dt
        this.x += Math.sin(this.behaviorTimer * 2.5) * 1.5 * 60 * dt
        break
    }

    // 射击
    if (this.fireTimer <= 0 && this.firePattern && !this.isStealth) {
      this._fire()
      this.fireTimer = this.fireInterval
    }

    // 激光持续
    if (this.isLaserOn) {
      this.laserTimer -= dt
      if (this.laserTimer <= 0) {
        this.isLaserOn = false
      }
    }

    // 出界销毁
    if (this.y > GAME_HEIGHT + 60) {
      this.active = false
    }
    if (this.x < -60 || this.x > GAME_WIDTH + 60) {
      this.active = false
    }
  }

  _fire() {
    if (!this.game.player || !this.game.player.alive) return

    const px = this.game.player.x
    const py = this.game.player.y

    if (this.firePattern === 'single') {
      this._spawnBullet(this.x, this.y + this.size.h / 2, 0, this.bulletSpeed)
    } else if (this.firePattern === 'double') {
      this._spawnBullet(this.x - 8, this.y + this.size.h / 2, 0, this.bulletSpeed)
      this._spawnBullet(this.x + 8, this.y + this.size.h / 2, 0, this.bulletSpeed)
    } else if (this.firePattern === 'spread') {
      const count = this.bulletCount || 3
      for (let i = 0; i < count; i++) {
        const angle = Math.PI / 2 + (i - (count - 1) / 2) * 0.3
        const vx = Math.cos(angle) * this.bulletSpeed
        const vy = Math.sin(angle) * this.bulletSpeed
        this._spawnBullet(this.x, this.y + this.size.h / 2, vx, vy)
      }
    } else if (this.firePattern === 'laser') {
      this.isLaserOn = true
      this.laserTimer = this.laserDuration
    }
  }

  _spawnBullet(x, y, vx, vy) {
    this.game.events.emit('enemy_bullet', {
      x, y, vx, vy,
      damage: 1,
      color: this.bulletColor,
      radius: 4,
      tag: 'enemy_bullet',
    })
  }

  takeDamage(amount) {
    if (this.flashTimer > 0) return

    if (this.hasShield && this.shieldHp > 0) {
      this.shieldHp -= amount
      this.flashTimer = 0.1
      return
    }

    this.hp -= amount
    this.flashTimer = 0.1

    if (this.hp <= 0) {
      this.active = false
      this.game.camera.shake(4, 0.15)
      this.game.particles.emitExplosion(this.x, this.y, 20)
      this.game.events.emit('enemy_killed', { enemy: this })
    }
  }

  getDrop() {
    const drops = []
    for (const drop of this.dropTable) {
      if (Math.random() < drop.chance) {
        drops.push({ type: drop.item, value: drop.value })
      }
    }
    return drops
  }

  render(ctx) {
    if (!this.active) return
    if (this.isStealth) {
      ctx.globalAlpha = 0.2
    }

    const { x, y } = this
    const halfW = this.size.w / 2
    const halfH = this.size.h / 2
    const scale = Math.min(this.size.w / 40, this.size.h / 48)

    const flashColor = this.flashTimer > 0 ? '#ffffff' : this.color
    const bodyColor = this.flashTimer > 0 ? '#ffffff' : this._darkenColor(this.color)

    ctx.save()
    ctx.translate(x, y)
    ctx.scale(scale, scale)

    // 引擎尾焰（敌机朝下）
    const gradient = ctx.createLinearGradient(0, -10, 0, -24)
    gradient.addColorStop(0, flashColor)
    gradient.addColorStop(0.5, this._darkenColor(this.color, 0.5))
    gradient.addColorStop(1, 'transparent')
    ctx.fillStyle = gradient
    ctx.beginPath()
    ctx.moveTo(-6, -10)
    ctx.lineTo(6, -10)
    ctx.lineTo(1.5, -22)
    ctx.lineTo(-1.5, -22)
    ctx.closePath()
    ctx.fill()

    // 机身
    ctx.fillStyle = bodyColor
    ctx.strokeStyle = flashColor
    ctx.lineWidth = 2
    ctx.beginPath()
    ctx.moveTo(0, 18)
    ctx.lineTo(8, -6)
    ctx.lineTo(3, -10)
    ctx.lineTo(-3, -10)
    ctx.lineTo(-8, -6)
    ctx.closePath()
    ctx.fill()
    ctx.stroke()

    // 座舱
    ctx.fillStyle = flashColor
    ctx.beginPath()
    ctx.ellipse(0, 2, 3, 6, 0, 0, Math.PI * 2)
    ctx.fill()

    // 机翼
    ctx.fillStyle = this._darkenColor(bodyColor, 0.7)
    ctx.strokeStyle = this._darkenColor(flashColor, 0.7)
    ctx.lineWidth = 1.5
    ctx.beginPath()
    ctx.moveTo(-4, 6)
    ctx.lineTo(-14, -3)
    ctx.lineTo(-8, -5)
    ctx.lineTo(-3, 2)
    ctx.closePath()
    ctx.fill()
    ctx.stroke()
    ctx.beginPath()
    ctx.moveTo(4, 6)
    ctx.lineTo(14, -3)
    ctx.lineTo(8, -5)
    ctx.lineTo(3, 2)
    ctx.closePath()
    ctx.fill()
    ctx.stroke()

    ctx.restore()
    ctx.globalAlpha = 1

    // 护盾
    if (this.hasShield && this.shieldHp > 0) {
      const shieldAlpha = this.shieldHp / this.maxShieldHp * 0.6
      ctx.strokeStyle = `rgba(68, 136, 255, ${shieldAlpha})`
      ctx.lineWidth = 2
      ctx.beginPath()
      ctx.arc(x, y, halfW + 4, 0, Math.PI * 2)
      ctx.stroke()
    }

    // 激光
    if (this.isLaserOn && this.game.player && this.game.player.alive) {
      ctx.strokeStyle = this.bulletColor
      ctx.lineWidth = 3
      ctx.shadowColor = this.bulletColor
      ctx.shadowBlur = 10
      ctx.beginPath()
      ctx.moveTo(this.x, this.y + halfH)
      ctx.lineTo(this.game.player.x, this.game.player.y)
      ctx.stroke()
      ctx.shadowBlur = 0
    }
  }

  _darkenColor(hex, factor = 0.6) {
    const c = hex.replace('#', '')
    const r = Math.floor(parseInt(c.substring(0, 2), 16) * factor)
    const g = Math.floor(parseInt(c.substring(2, 4), 16) * factor)
    const b = Math.floor(parseInt(c.substring(4, 6), 16) * factor)
    return `rgb(${r},${g},${b})`
  }
}

// ==================== entities/bosses/Boss.js ====================
// ==================== BOSS 基类 ====================

class Boss extends Entity {
  constructor(game, config) {
    super(GAME_WIDTH / 2, -100, {
      size: config.size || { w: 200, h: 120 },
      color: config.color || '#ff2244',
    })
    this.game = game
    this.tag = 'boss'
    this.bossId = config.id
    this.name = config.name || 'BOSS'
    this.maxHp = config.hp || 5000
    this.hp = this.maxHp
    this.score = config.score || 500
    this.phases = config.phases || []
    this.currentPhase = 0
    this.phaseTimer = 0
    this.entering = true
    this.enterY = GAME_HEIGHT * 0.2
    this.moveDir = 1
    this.moveTimer = 0
    this.moveSpeed = 1.5
    this.coreWeak = config.coreWeak || false
    this.coreX = GAME_WIDTH / 2
    this.coreY = 0
    this.coreRadius = 20

    // 阶段数据
    this._phaseData = null
    this._attackTimer = 0
    this._attackIndex = 0
    this._spreadTimer = 0
    this._laserTimer = 0
    this._isLaserActive = false
    this._spiralTimer = 0
    this._spiralAngle = 0
    this._shieldActive = false
    this._shieldHp = 0
    this._summonTimer = 0
    this._hasShieldPhase = false

    // 特殊效果
    this.flashTimer = 0
    this.damageFlash = 0
  }

  init() {
    this.x = GAME_WIDTH / 2
    this.y = -100
    this.entering = true
    this.hp = this.maxHp
    this.currentPhase = 0
    this.phaseTimer = 0
    this._attackTimer = 0
    this._attackIndex = 0
    this._spreadTimer = 0
    this._isLaserActive = false
    this._spiralTimer = 0
    this._spiralAngle = 0
    this._shieldActive = false
    this._shieldHp = 0
    this._summonTimer = 0
    this._hasShieldPhase = false
  }

  update(dt) {
    this.phaseTimer += dt
    this.flashTimer -= dt
    this.damageFlash -= dt

    // 入场动画
    if (this.entering) {
      this.y += 1.5 * 60 * dt
      if (this.y >= this.enterY) {
        this.y = this.enterY
        this.entering = false
      }
      return
    }

    // 移动
    this.moveTimer += dt
    this.x += this.moveDir * this.moveSpeed * 60 * dt
    if (this.moveTimer > 2) {
      this.moveDir *= -1
      this.moveTimer = 0
    }
    const halfW = this.size.w / 2
    this.x = Math.max(halfW, Math.min(GAME_WIDTH - halfW, this.x))

    // 阶段检测
    this._updatePhases(dt)

    // 攻击逻辑
    this._updateAttacks(dt)

    // 护盾
    if (this._shieldActive) {
      this._shieldTimer += dt
      if (this._shieldTimer >= 5) {
        this._shieldActive = false
        this._hasShieldPhase = false
      }
    }
  }

  _updatePhases(dt) {
    const hpPercent = this.hp / this.maxHp
    let newPhase = 0
    if (hpPercent <= 0.3) newPhase = 2
    else if (hpPercent <= 0.6) newPhase = 1

    if (newPhase !== this.currentPhase && this.phases.length > 0) {
      this.currentPhase = newPhase
      this.game.events.emit('boss_phase_change', { phase: newPhase + 1 })
    }
  }

  _updateAttacks(dt) {
    this._attackTimer += dt
    this._spreadTimer += dt
    this._laserTimer += dt
    this._spiralTimer += dt
    this._summonTimer += dt

    const player = this.game.player
    if (!player || !player.alive) return

    // 阶段一：直射 + 扇形弹幕
    if (this.currentPhase === 0) {
      // 左右炮台交替射击
      if (this._attackTimer >= 0.6) {
        this._attackTimer = 0
        this._attackIndex = (this._attackIndex + 1) % 2
        const bx = this._attackIndex === 0 ? this.x - 60 : this.x + 60
        const angle = angleTo({ x: bx, y: this.y + 20 }, player)
        const v = vecFromAngle(angle, 4)
        this._spawnBullet(bx, this.y + 20, v.x, v.y)
      }

      // 扇形弹幕
      if (this._spreadTimer >= 8) {
        this._spreadTimer = 0
        const count = 15
        const spreadAngle = Math.PI * 0.7
        for (let i = 0; i < count; i++) {
          const a = Math.PI / 2 + (i - (count - 1) / 2) * (spreadAngle / (count - 1))
          const v = vecFromAngle(a, 3)
          this._spawnBullet(this.x, this.y + 30, v.x, v.y)
        }
      }
    }

    // 阶段二：新增激光 + 召唤自爆机
    if (this.currentPhase === 1) {
      // 激光
      if (this._laserTimer >= 4) {
        this._laserTimer = 0
        this._isLaserActive = true
        setTimeout(() => { this._isLaserActive = false }, 2000)
      }

      // 召唤自爆机
      if (this._summonTimer >= 8) {
        this._summonTimer = 0
        this.game.events.emit('boss_summon', { type: 'suicide', count: 2 })
      }

      // 弹幕间隔缩短
      this._spreadTimer += dt * 0.3
      if (this._spreadTimer >= 6) {
        this._spreadTimer = 0
        const count = 18
        for (let i = 0; i < count; i++) {
          const a = Math.PI / 2 + (i - (count - 1) / 2) * (Math.PI * 0.8 / (count - 1))
          const v = vecFromAngle(a, 3.5)
          this._spawnBullet(this.x, this.y + 30, v.x, v.y)
        }
      }
    }

    // 阶段三：螺旋弹幕 + 护盾 + 快速移动
    if (this.currentPhase === 2) {
      // 螺旋弹幕
      if (this._spiralTimer >= 0.1) {
        this._spiralAngle += 0.3
        const v = vecFromAngle(this._spiralAngle, 3)
        this._spawnBullet(this.x, this.y + 30, v.x, v.y)
        this._spiralTimer = 0
      }

      // 护盾
      if (this._shieldTimer >= 10 && !this._shieldActive) {
        this._shieldActive = true
        this._shieldHp = 200
        this._shieldTimer = 0
        this._hasShieldPhase = true
      }

      // 快速移动
      this.moveSpeed = 3
    }
  }

  _spawnBullet(x, y, vx, vy) {
    this.game.events.emit('enemy_bullet', {
      x, y, vx, vy,
      damage: 1,
      color: '#ff2244',
      radius: 5,
      tag: 'enemy_bullet',
    })
  }

  takeDamage(amount) {
    if (this.entering) return
    if (this._shieldActive && this._shieldHp > 0) {
      this._shieldHp -= amount
      if (this._shieldHp <= 0) {
        this._shieldActive = false
      }
      this.flashTimer = 0.1
      return
    }

    this.hp -= amount
    this.flashTimer = 0.1
    this.damageFlash = 0.05

    // 伤害数字
    this.game.events.emit('damage_number', {
      x: this.x + (Math.random() - 0.5) * 60,
      y: this.y + (Math.random() - 0.5) * 40,
      value: amount,
    })

    if (this.hp <= 0) {
      this.hp = 0
      this.active = false
      this.game.camera.shake(12, 0.5)
      this.game.particles.emitExplosion(this.x, this.y, 60)
      this.game.events.emit('boss_killed', { boss: this })
    }
  }

  render(ctx) {
    if (!this.active) return

    const { x, y } = this
    const halfW = this.size.w / 2
    const halfH = this.size.h / 2

    ctx.save()
    ctx.translate(x, y)

    // 命中闪烁
    if (this.flashTimer > 0) {
      ctx.fillStyle = '#ffffff'
      ctx.strokeStyle = '#ffffff'
    } else {
      ctx.fillStyle = this.currentPhase === 2 ? '#aa0000' : '#2a1a2a'
      ctx.strokeStyle = this.color
    }

    // 主体
    ctx.lineWidth = 3
    ctx.fillRect(-halfW, -halfH, this.size.w, this.size.h)
    ctx.strokeRect(-halfW, -halfH, this.size.w, this.size.h)

    // 装甲板
    ctx.fillStyle = '#1a1020'
    ctx.fillRect(-halfW + 10, -halfH + 10, this.size.w - 20, this.size.h - 20)

    // 中央能量核心（弱点）
    const coreGlow = this.flashTimer > 0 ? '#ffffff' : '#ff2244'
    ctx.fillStyle = coreGlow
    ctx.shadowColor = coreGlow
    ctx.shadowBlur = 20
    ctx.beginPath()
    ctx.arc(0, 0, 15, 0, Math.PI * 2)
    ctx.fill()
    ctx.shadowBlur = 0

    // 炮台
    const gunColor = this.flashTimer > 0 ? '#ffffff' : '#884444'
    ctx.fillStyle = gunColor
    ctx.fillRect(-60, -halfH - 10, 12, 20)
    ctx.fillRect(48, -halfH - 10, 12, 20)

    // 阶段二破损效果
    if (this.currentPhase >= 1) {
      ctx.fillStyle = '#ff4444'
      ctx.beginPath()
      ctx.arc(-halfW + 30, -halfH + 30, 5, 0, Math.PI * 2)
      ctx.fill()
      ctx.beginPath()
      ctx.arc(halfW - 30, -halfH + 30, 5, 0, Math.PI * 2)
      ctx.fill()
    }

    // 阶段三破损
    if (this.currentPhase >= 2) {
      ctx.fillStyle = '#ff0000'
      ctx.globalAlpha = 0.5 + Math.sin(this.phaseTimer * 10) * 0.3
      ctx.fillRect(-halfW, -halfH, this.size.w, this.size.h)
      ctx.globalAlpha = 1
      // 损坏粒子
      ctx.fillStyle = '#ff8800'
      for (let i = 0; i < 3; i++) {
        ctx.beginPath()
        ctx.arc(
          -halfW + Math.random() * this.size.w,
          -halfH + Math.random() * this.size.h,
          3 + Math.random() * 3,
          0, Math.PI * 2
        )
        ctx.fill()
      }
    }

    // 护盾
    if (this._shieldActive) {
      const shieldAlpha = 0.3 + Math.sin(this.phaseTimer * 5) * 0.2
      ctx.strokeStyle = `rgba(255, 200, 0, ${shieldAlpha})`
      ctx.lineWidth = 4
      ctx.beginPath()
      ctx.arc(0, 0, halfW + 10, 0, Math.PI * 2)
      ctx.stroke()
    }

    // 激光
    if (this._isLaserActive && this.game.player && this.game.player.alive) {
      ctx.strokeStyle = '#ff2244'
      ctx.lineWidth = 4
      ctx.shadowColor = '#ff2244'
      ctx.shadowBlur = 15
      ctx.beginPath()
      ctx.moveTo(-60, -halfH - 10)
      ctx.lineTo(this.game.player.x - x, this.game.player.y - y)
      ctx.stroke()
      ctx.beginPath()
      ctx.moveTo(60, -halfH - 10)
      ctx.lineTo(this.game.player.x - x, this.game.player.y - y)
      ctx.stroke()
      ctx.shadowBlur = 0
    }

    ctx.restore()
  }

  _renderHpBar(ctx) {
    const barWidth = 300
    const barHeight = 12
    const barX = GAME_WIDTH / 2 - barWidth / 2
    const barY = 20
    const hpPercent = this.hp / this.maxHp

    // 背景
    ctx.fillStyle = '#333'
    ctx.fillRect(barX, barY, barWidth, barHeight)

    // 血量
    const hpColor = hpPercent > 0.3 ? '#ff2244' : '#ff0000'
    ctx.fillStyle = hpColor
    ctx.fillRect(barX, barY, barWidth * hpPercent, barHeight)

    // 边框
    ctx.strokeStyle = '#ffffff'
    ctx.lineWidth = 2
    ctx.strokeRect(barX, barY, barWidth, barHeight)

    // 护盾条
    if (this._shieldActive) {
      const shieldPercent = this._shieldHp / 200
      ctx.fillStyle = 'rgba(255, 200, 0, 0.7)'
      ctx.fillRect(barX, barY - 8, barWidth * shieldPercent, 6)
    }

    // 名字和阶段
    ctx.fillStyle = '#ffffff'
    ctx.font = '14px Orbitron'
    ctx.textAlign = 'center'
    ctx.fillText(`${this.name} - Phase ${this.currentPhase + 1}/3`, GAME_WIDTH / 2, barY - 14)
  }
}

// ==================== systems/WeaponSystem.js ====================
// ==================== 武器系统 ====================

class WeaponSystem {
  constructor(game) {
    this.game = game
    this.activeWeapon = 'main'
  }

  getConfig() {
    return weaponConfig[this.activeWeapon]
  }

  getLevel(weaponLevel) {
    const config = this.getConfig()
    return config.levels[Math.min(weaponLevel - 1, config.levels.length - 1)]
  }

  switchWeapon(weaponId) {
    if (weaponConfig[weaponId]) {
      this.activeWeapon = weaponId
    }
  }

  fire(playerX, playerY, weaponLevel, damageBonus) {
    const config = this.getConfig()
    const level = this.getLevel(weaponLevel)
    const count = level.bulletCount || 1
    const spread = level.spread || 0
    const baseDamage = (level.damage || 1) * damageBonus

    const bullets = []
    for (let i = 0; i < count; i++) {
      const offset = (i - (count - 1) / 2) * spread
      const angle = -Math.PI / 2 + offset
      const vx = Math.cos(angle) * config.bulletSpeed
      const vy = Math.sin(angle) * config.bulletSpeed

      bullets.push({
        x: playerX + offset * 15,
        y: playerY - 24,
        vx: vx,
        vy: vy,
        damage: baseDamage,
        color: config.bulletColor || '#00f0ff',
        radius: 3,
        tag: 'player_bullet',
        tracking: config.tracking || false,
        pierce: config.pierce || false,
        aoe: config.aoe || 0,
        duration: config.duration || 0,
      })
    }
    return bullets
  }
}

// ==================== systems/SkillSystem.js ====================
// ==================== 技能系统 ====================

class SkillSystem {
  constructor(game) {
    this.game = game
    this.cooldowns = {}
    this.activeEffects = []
  }

  useSkill(skillId, player) {
    const config = skillConfig[skillId]
    if (!config) return false
    if (this.cooldowns[skillId] && this.cooldowns[skillId] > 0) return false

    this.cooldowns[skillId] = config.cooldown

    switch (config.effect) {
      case 'invincible':
        player.invincibleTimer = config.duration
        // 反弹效果：碰撞时自动处理
        this.activeEffects.push({
          type: 'invincible',
          timer: config.duration,
          player: player,
        })
        break

      case 'clearScreen':
        // 清屏炸弹
        this.game.camera.shake(10, 0.5)
        this.game.events.emit('clear_screen', { bossDamage: config.bossDamage || 200 })
        // 全屏闪光
        this.activeEffects.push({
          type: 'flash',
          timer: 0.3,
        })
        break

      case 'slowTime':
        this.game.timeScale = config.slowFactor
        this.activeEffects.push({
          type: 'slowTime',
          timer: config.duration,
        })
        break

      case 'autoAim':
        this.activeEffects.push({
          type: 'autoAim',
          timer: config.duration,
        })
        break

      case 'summonDrone':
        player.drones.push({
          x: player.x - 30,
          y: player.y,
          offsetAngle: -Math.PI / 4,
          timer: config.duration,
          fireTimer: 0,
          active: true,
        })
        player.drones.push({
          x: player.x + 30,
          y: player.y,
          offsetAngle: Math.PI / 4,
          timer: config.duration,
          fireTimer: 0.15,
          active: true,
        })
        break
    }

    return true
  }

  update(dt) {
    // 更新冷却
    for (const key in this.cooldowns) {
      if (this.cooldowns[key] > 0) {
        this.cooldowns[key] -= dt
      }
    }

    // 更新活跃效果
    for (let i = this.activeEffects.length - 1; i >= 0; i--) {
      const fx = this.activeEffects[i]
      fx.timer -= dt
      if (fx.timer <= 0) {
        if (fx.type === 'slowTime') {
          this.game.timeScale = 1
        }
        this.activeEffects.splice(i, 1)
      }
    }
  }

  getCooldown(skillId) {
    return this.cooldowns[skillId] || 0
  }

  getCooldownPercent(skillId) {
    const config = skillConfig[skillId]
    if (!config) return 0
    const cd = this.cooldowns[skillId] || 0
    return cd > 0 ? cd / config.cooldown : 0
  }

  isAutoAimActive() {
    return this.activeEffects.some(fx => fx.type === 'autoAim')
  }

  isInvincible() {
    return this.activeEffects.some(fx => fx.type === 'invincible')
  }
}

// ==================== systems/ScoreSystem.js ====================
// ==================== 分数系统 ====================
class ScoreSystem {
  constructor() {
    this.score = 0
    this.combo = 0
    this.maxCombo = 0
    this.comboTimer = 0
    this.comboTimeout = 1.5
    this.killCount = 0
    this.hitCount = 0
    this.totalShots = 0
    this.coinsCollected = 0
  }

  init() {
    this.score = 0
    this.combo = 0
    this.maxCombo = 0
    this.comboTimer = 0
    this.killCount = 0
    this.hitCount = 0
    this.totalShots = 0
    this.coinsCollected = 0
  }

  update(dt) {
    if (this.combo > 0) {
      this.comboTimer -= dt
      if (this.comboTimer <= 0) {
        this.combo = 0
      }
    }
  }

  addKill(baseScore) {
    this.killCount++
    this.combo++
    this.maxCombo = Math.max(this.maxCombo, this.combo)
    this.comboTimer = this.comboTimeout
    const comboBonus = Math.min(this.combo - 1, 10) * 0.1
    const points = Math.floor(baseScore * (1 + comboBonus))
    this.score += points
    return points
  }

  addHit() {
    this.hitCount++
  }

  addShot() {
    this.totalShots++
  }

  addCoins(amount) {
    this.coinsCollected += amount
  }

  get accuracy() {
    return this.totalShots > 0 ? this.hitCount / this.totalShots : 0
  }

  getStarRating() {
    const accuracy = this.accuracy
    if (accuracy >= 0.7 && this.combo >= 30) return 3
    if (accuracy >= 0.4 && this.combo >= 15) return 2
    return 1
  }
}

// ==================== systems/SpawnSystem.js ====================
// ==================== 敌机生成系统 ====================

class SpawnSystem {
  constructor(game) {
    this.game = game
    this.waveIndex = 0
    this.waveTimer = 0
    this.spawnTimer = 0
    this.spawnCount = 0
    this.spawnInterval = 0
    this.currentType = null
    this.waves = []
    this.finished = false
    this.levelDuration = 0
    this.elapsedTime = 0
  }

  init(waves, duration) {
    this.waves = [...waves].sort((a, b) => a.time - b.time)
    this.waveIndex = 0
    this.waveTimer = 0
    this.spawnTimer = 0
    this.spawnCount = 0
    this.spawnInterval = 0
    this.currentType = null
    this.finished = false
    this.levelDuration = duration
    this.elapsedTime = 0
  }

  update(dt) {
    this.elapsedTime += dt

    if (this.finished) return

    // 检查下一个波次
    if (this.waveIndex < this.waves.length) {
      const wave = this.waves[this.waveIndex]
      if (this.elapsedTime >= wave.time) {
        this.currentType = wave.type
        this.spawnCount = wave.count
        this.spawnInterval = wave.interval
        this.spawnTimer = 0
        this.waveIndex++
      }
    }

    // 生成敌机
    if (this.spawnCount > 0) {
      this.spawnTimer += dt
      if (this.spawnTimer >= this.spawnInterval) {
        this.spawnTimer = 0
        this.spawnCount--
        this._spawnEnemy(this.currentType)
      }
    }

    // 检查是否完成
    if (this.waveIndex >= this.waves.length && this.spawnCount <= 0) {
      if (this.levelDuration > 0 && this.elapsedTime >= this.levelDuration) {
        this.finished = true
      }
    }
  }

  _spawnEnemy(type) {
    const x = randomRange(40, GAME_WIDTH - 40)
    this.game.events.emit('spawn_enemy', { type, x, y: -30 })
  }

  spawnBoss(bossId) {
    this.game.events.emit('spawn_boss', { bossId })
  }
}

// ==================== scenes/MenuScene.js ====================
// ==================== 主菜单场景 ====================

class MenuScene {
  constructor(game) {
    this.game = game
    this.starField = new StarField(3)
    this.titleGlow = 0
    this.selectedIdx = 0
    this.menuItems = ['开始游戏', '飞机选择', '商店升级', '操作说明']
    this.save = loadSave()
    this.showInstructions = false
    this.skinSelection = !!(this.save.selectedSkin)
    this.selectedSkinIdx = 0
    this.skins = [
      { id: 'cyan', name: '星云战机', primary: '#00f0ff', secondary: '#1a2a4a', accent: '#0088ff' },
      { id: 'red', name: '烈焰战机', primary: '#ff4444', secondary: '#2a1a1a', accent: '#ff8844' },
      { id: 'green', name: '翠绿战机', primary: '#00ff66', secondary: '#1a2a1a', accent: '#00aa44' },
      { id: 'gold', name: '黄金战机', primary: '#ffdd00', secondary: '#2a2a1a', accent: '#ffaa00' },
      { id: 'purple', name: '紫电战机', primary: '#ff00ff', secondary: '#2a1a2a', accent: '#cc44ff' },
    ]
    // 确保默认皮肤的索引
    const currentSkin = this.save.selectedSkin || 'cyan'
    this.selectedSkinIdx = this.skins.findIndex(s => s.id === currentSkin)
    if (this.selectedSkinIdx < 0) this.selectedSkinIdx = 0
  }

  init() {
    this.selectedIdx = 0
    this.showInstructions = false
    this.save = loadSave()
    const currentSkin = this.save.selectedSkin || 'cyan'
    this.selectedSkinIdx = this.skins.findIndex(s => s.id === currentSkin)
    if (this.selectedSkinIdx < 0) this.selectedSkinIdx = 0
    this.game.input.keys['click'] = false
  }

  destroy() {
    /* 清理由 Game 统一管理 */
  }

  _select() {
    if (this.showInstructions) {
      this.showInstructions = false
      return
    }

    const choice = this.menuItems[this.selectedIdx]
    switch (choice) {
      case '开始游戏':
        this.save.playCount++
        this.game.scenes.switchTo('battle', { level: this.save.maxLevelUnlocked || 1 })
        break
      case '飞机选择':
        this.skinSelection = true
        break
      case '商店升级':
        this.game.scenes.switchTo('shop')
        break
      case '操作说明':
        this.showInstructions = true
        break
    }
  }

  _selectSkin() {
    const skin = this.skins[this.selectedSkinIdx]
    this.save.selectedSkin = skin.id
    saveSave(this.save)
    this.skinSelection = false
  }

  update(dt) {
    this.starField.update(dt)
    this.titleGlow += dt * 2

    if (this.showInstructions) {
      if (this.game.input.isKeyPressed('Enter') || this.game.input.isKeyPressed(' ') ||
          this.game.input.isKeyPressed('Escape') || this.game.input.isKeyPressed('click')) {
        this.showInstructions = false
      }
      return
    }

    if (this.skinSelection) {
      if (this.game.input.isKeyPressed('ArrowLeft')) {
        this.selectedSkinIdx = Math.max(0, this.selectedSkinIdx - 1)
      }
      if (this.game.input.isKeyPressed('ArrowRight')) {
        this.selectedSkinIdx = Math.min(this.skins.length - 1, this.selectedSkinIdx + 1)
      }
      if (this.game.input.isKeyPressed('Enter') || this.game.input.isKeyPressed(' ')) {
        this._selectSkin()
      }
      if (this.game.input.isKeyPressed('Escape')) {
        this.skinSelection = false
      }
      if (this.game.input.isKeyPressed('click')) {
        this._selectSkin()
      }
      return
    }

    if (this.game.input.isKeyPressed('Enter') || this.game.input.isKeyPressed(' ')) {
      this._select()
    }
    if (this.game.input.isKeyPressed('ArrowUp')) {
      this.selectedIdx = Math.max(0, this.selectedIdx - 1)
    }
    if (this.game.input.isKeyPressed('ArrowDown')) {
      this.selectedIdx = Math.min(this.menuItems.length - 1, this.selectedIdx + 1)
    }
    if (this.game.input.isKeyPressed('click')) {
      this._select()
    }
  }

  render(ctx) {
    this.starField.render(ctx)

    if (this.showInstructions) {
      this._renderInstructions(ctx)
      return
    }

    if (this.skinSelection) {
      this._renderSkinSelection(ctx)
      return
    }

    const cx = GAME_WIDTH / 2

    // 标题
    const glow = 0.5 + Math.sin(this.titleGlow) * 0.3
    ctx.save()
    ctx.shadowColor = '#00f0ff'
    ctx.shadowBlur = 20 + glow * 20
    ctx.fillStyle = '#00f0ff'
    ctx.font = 'bold 42px Orbitron'
    ctx.textAlign = 'center'
    ctx.fillText('星际战机', cx, 140)
    ctx.shadowBlur = 10
    ctx.font = '16px Orbitron'
    ctx.fillStyle = '#888'
    ctx.fillText('STAR FIGHTER', cx, 175)
    ctx.restore()

    // 装饰线
    ctx.strokeStyle = '#00f0ff'
    ctx.lineWidth = 1
    ctx.globalAlpha = 0.5
    ctx.beginPath()
    ctx.moveTo(cx - 120, 195)
    ctx.lineTo(cx + 120, 195)
    ctx.stroke()
    ctx.globalAlpha = 1

    // 当前皮肤的战机预览
    const previewSkin = this.skins[this.selectedSkinIdx]
    this._drawPreviewPlane(ctx, cx, 260, previewSkin)

    // 菜单选项
    const baseY = 340
    for (let i = 0; i < this.menuItems.length; i++) {
      const label = this.menuItems[i]
      const isSelected = i === this.selectedIdx
      const optY = baseY + i * 55

      if (isSelected) {
        ctx.fillStyle = 'rgba(0, 240, 255, 0.12)'
        ctx.fillRect(cx - 110, optY - 20, 220, 42)
        ctx.strokeStyle = '#00f0ff'
        ctx.lineWidth = 1.5
        ctx.beginPath()
        ctx.roundRect(cx - 110, optY - 20, 220, 42, 8)
        ctx.stroke()
        // 左箭头
        ctx.fillStyle = '#00f0ff'
        ctx.font = '16px sans-serif'
        ctx.textAlign = 'left'
        ctx.fillText('▸', cx - 100, optY + 8)
        ctx.textAlign = 'right'
        ctx.fillText('◂', cx + 100, optY + 8)
      }

      ctx.fillStyle = isSelected ? '#00f0ff' : '#aaa'
      ctx.font = 'bold 20px Orbitron'
      ctx.textAlign = 'center'
      ctx.fillText(label, cx, optY + 8)
    }

    // 底部信息
    ctx.fillStyle = '#555'
    ctx.font = '11px Orbitron'
    ctx.textAlign = 'center'
    ctx.fillText('方向键选择  |  空格/回车确认  |  触屏点击', cx, GAME_HEIGHT - 50)
    ctx.fillText(`已解锁关卡: ${this.save.maxLevelUnlocked || 1}  |  金币: ${this.save.coins || 0}`, cx, GAME_HEIGHT - 30)
  }

  _drawPreviewPlane(ctx, cx, cy, skin) {
    ctx.save()
    ctx.translate(cx, cy)
    ctx.scale(1.3, 1.3)

    // 引擎尾焰
    const gradient = ctx.createLinearGradient(0, 10, 0, 30)
    gradient.addColorStop(0, skin.primary)
    gradient.addColorStop(0.5, skin.accent)
    gradient.addColorStop(1, 'transparent')
    ctx.fillStyle = gradient
    ctx.beginPath()
    ctx.moveTo(-8, 12)
    ctx.lineTo(8, 12)
    ctx.lineTo(2, 28)
    ctx.lineTo(-2, 28)
    ctx.closePath()
    ctx.fill()

    // 机身
    ctx.fillStyle = skin.secondary
    ctx.strokeStyle = skin.primary
    ctx.lineWidth = 2
    ctx.shadowColor = skin.primary
    ctx.shadowBlur = 8
    ctx.beginPath()
    ctx.moveTo(0, -22)
    ctx.lineTo(10, 8)
    ctx.lineTo(4, 14)
    ctx.lineTo(-4, 14)
    ctx.lineTo(-10, 8)
    ctx.closePath()
    ctx.fill()
    ctx.stroke()
    ctx.shadowBlur = 0

    // 座舱
    ctx.fillStyle = skin.primary
    ctx.beginPath()
    ctx.ellipse(0, -2, 4, 8, 0, 0, Math.PI * 2)
    ctx.fill()

    // 机翼
    ctx.fillStyle = '#0d1a33'
    ctx.strokeStyle = skin.accent
    ctx.lineWidth = 1.5
    ctx.beginPath()
    ctx.moveTo(-5, -8)
    ctx.lineTo(-18, 4)
    ctx.lineTo(-10, 6)
    ctx.lineTo(-3, -2)
    ctx.closePath()
    ctx.fill()
    ctx.stroke()
    ctx.beginPath()
    ctx.moveTo(5, -8)
    ctx.lineTo(18, 4)
    ctx.lineTo(10, 6)
    ctx.lineTo(3, -2)
    ctx.closePath()
    ctx.fill()
    ctx.stroke()

    ctx.restore()
  }

  _renderSkinSelection(ctx) {
    const cx = GAME_WIDTH / 2
    const skin = this.skins[this.selectedSkinIdx]

    ctx.fillStyle = '#00f0ff'
    ctx.font = 'bold 28px Orbitron'
    ctx.textAlign = 'center'
    ctx.fillText('选择战机', cx, 60)

    ctx.fillStyle = '#888'
    ctx.font = '14px Orbitron'
    ctx.fillText('← → 切换  |  回车确认  |  ESC 返回', cx, 90)

    // 战机大预览
    this._drawPreviewPlane(ctx, cx, 220, skin)

    // 皮肤名
    ctx.fillStyle = skin.primary
    ctx.font = 'bold 22px Orbitron'
    ctx.textAlign = 'center'
    ctx.fillText(skin.name, cx, 310)

    // 皮肤颜色预览
    const swatchY = 340
    const colors = [skin.primary, skin.secondary, skin.accent]
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = colors[i]
      ctx.beginPath()
      ctx.roundRect(cx - 60 + i * 45, swatchY, 30, 20, 4)
      ctx.fill()
      ctx.strokeStyle = '#fff'
      ctx.lineWidth = 1
      ctx.stroke()
    }

    // 左右箭头
    ctx.fillStyle = '#00f0ff'
    ctx.font = 'bold 30px Orbitron'
    ctx.fillText('◀', cx - 140, 220)
    ctx.fillText('▶', cx + 140, 220)

    // 进度点
    for (let i = 0; i < this.skins.length; i++) {
      ctx.fillStyle = i === this.selectedSkinIdx ? '#00f0ff' : '#444'
      ctx.beginPath()
      ctx.arc(cx + (i - 2) * 25, 380, 5, 0, Math.PI * 2)
      ctx.fill()
    }

    // 底部
    ctx.fillStyle = '#555'
    ctx.font = '11px Orbitron'
    ctx.textAlign = 'center'
    ctx.fillText('皮肤仅改变外观，不影响属性', cx, GAME_HEIGHT - 40)
  }
