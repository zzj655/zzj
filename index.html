// ==================== scenes/ShopScene.js ====================
// ==================== 商店场景 ====================

class ShopScene {
  constructor(game) {
    this.game = game
    this.starField = new StarField(3)
    this.save = loadSave()
    this.tab = 'upgrades' // upgrades | weapons | skills
    this.selectedIdx = 0
  }

  init() {
    this.save = loadSave()
    this.tab = 'upgrades'
    this.selectedIdx = 0
  }

  destroy() {
    this.game.input.keys['click'] = false
  }

  update(dt) {
    this.starField.update(dt)

    if (this.game.input.isKeyPressed('Escape')) {
      this.game.scenes.switchTo('menu')
      return
    }

    // 标签切换
    if (this.game.input.isKeyPressed('ArrowLeft')) {
      const tabs = ['upgrades', 'weapons', 'skills']
      const idx = tabs.indexOf(this.tab)
      this.tab = tabs[Math.max(0, idx - 1)]
    }
    if (this.game.input.isKeyPressed('ArrowRight')) {
      const tabs = ['upgrades', 'weapons', 'skills']
      const idx = tabs.indexOf(this.tab)
      this.tab = tabs[Math.min(tabs.length - 1, idx + 1)]
    }
    if (this.game.input.isKeyPressed('ArrowUp')) {
      this.selectedIdx = Math.max(0, this.selectedIdx - 1)
    }
    if (this.game.input.isKeyPressed('ArrowDown')) {
      this.selectedIdx = Math.min(this._getItemCount() - 1, this.selectedIdx + 1)
    }
    if (this.game.input.isKeyPressed('Enter') || this.game.input.isKeyPressed(' ') || this.game.input.isKeyPressed('click')) {
      this._purchase()
    }
  }

  _getItemCount() {
    if (this.tab === 'upgrades') return 4
    if (this.tab === 'weapons') return Object.keys(weaponConfig).length
    if (this.tab === 'skills') return Object.keys(skillConfig).length
    return 0
  }

  _purchase() {
    if (this.tab === 'upgrades') {
      const upgrades = ['maxHp', 'moveSpeed', 'damage', 'shieldRegen']
      const type = upgrades[this.selectedIdx]
      if (!type) return
      const currentLevel = this.save.upgrades[type] || 0
      const cost = getUpgradeCost(type, currentLevel)
      if (this.save.coins >= cost && currentLevel < 5) {
        this.save.coins -= cost
        this.save.upgrades[type] = currentLevel + 1
        saveSave(this.save)
      }
    } else if (this.tab === 'weapons') {
      const weaponIds = Object.keys(weaponConfig)
      const weaponId = weaponIds[this.selectedIdx]
      if (!weaponId) return
      if (!this.save.unlockedWeapons.includes(weaponId)) {
        const cost = weaponId === 'main' ? 0 : 200
        if (this.save.coins >= cost) {
          this.save.coins -= cost
          this.save.unlockedWeapons.push(weaponId)
          saveSave(this.save)
        }
      }
    } else if (this.tab === 'skills') {
      const skillIds = Object.keys(skillConfig)
      const skillId = skillIds[this.selectedIdx]
      if (!skillId) return
      if (!this.save.unlockedSkills.includes(skillId)) {
        const cost = 300
        if (this.save.coins >= cost) {
          this.save.coins -= cost
          this.save.unlockedSkills.push(skillId)
          if (this.save.equippedSkills.length < 3) {
            this.save.equippedSkills.push(skillId)
          }
          saveSave(this.save)
        }
      } else {
        // 装备/卸载技能
        const idx = this.save.equippedSkills.indexOf(skillId)
        if (idx >= 0) {
          this.save.equippedSkills.splice(idx, 1)
        } else if (this.save.equippedSkills.length < 3) {
          this.save.equippedSkills.push(skillId)
        }
        saveSave(this.save)
      }
    }
  }

  render(ctx) {
    this.starField.render(ctx)

    // 标题
    ctx.fillStyle = '#ffdd00'
    ctx.font = 'bold 28px Orbitron'
    ctx.textAlign = 'center'
    ctx.fillText('商店', GAME_WIDTH / 2, 50)
    ctx.fillStyle = '#ffdd00'
    ctx.font = '14px Orbitron'
    ctx.fillText(`金币: ${this.save.coins}`, GAME_WIDTH / 2, 80)

    // 标签
    const tabs = [
      { key: 'upgrades', label: '属性升级' },
      { key: 'weapons', label: '武器' },
      { key: 'skills', label: '技能' },
    ]
    const tabW = 100
    const tabStart = GAME_WIDTH / 2 - (tabs.length * tabW) / 2
    for (let i = 0; i < tabs.length; i++) {
      const isActive = tabs[i].key === this.tab
      ctx.fillStyle = isActive ? 'rgba(0, 240, 255, 0.2)' : 'rgba(0,0,0,0.3)'
      ctx.strokeStyle = isActive ? '#00f0ff' : '#444'
      ctx.lineWidth = isActive ? 2 : 1
      const tx = tabStart + i * tabW
      ctx.beginPath()
      ctx.roundRect(tx, 95, tabW, 30, 4)
      ctx.fill()
      ctx.stroke()
      ctx.fillStyle = isActive ? '#00f0ff' : '#888'
      ctx.font = '12px Orbitron'
      ctx.textAlign = 'center'
      ctx.fillText(tabs[i].label, tx + tabW / 2, 115)
    }

    // 内容
    if (this.tab === 'upgrades') this._renderUpgrades(ctx)
    else if (this.tab === 'weapons') this._renderWeapons(ctx)
    else if (this.tab === 'skills') this._renderSkills(ctx)

    // 返回提示
    ctx.fillStyle = '#666'
    ctx.font = '11px Orbitron'
    ctx.textAlign = 'center'
    ctx.fillText('ESC 返回  |  方向键选择  |  回车/空格购买', GAME_WIDTH / 2, GAME_HEIGHT - 20)
  }

  _renderUpgrades(ctx) {
    const upgrades = [
      { type: 'maxHp', name: '最大生命', icon: '❤️' },
      { type: 'moveSpeed', name: '移动速度', icon: '🏃' },
      { type: 'damage', name: '火力伤害', icon: '💥' },
      { type: 'shieldRegen', name: '护盾恢复', icon: '🛡️' },
    ]

    const startY = 150
    for (let i = 0; i < upgrades.length; i++) {
      const u = upgrades[i]
      const level = this.save.upgrades[u.type] || 0
      const cost = getUpgradeCost(u.type, level)
      const isSelected = i === this.selectedIdx
      const maxLevel = 5
      const isMaxed = level >= maxLevel
      const canAfford = this.save.coins >= cost

      ctx.fillStyle = isSelected ? 'rgba(0, 240, 255, 0.1)' : 'rgba(0,0,0,0.3)'
      ctx.strokeStyle = isSelected ? '#00f0ff' : '#444'
      ctx.lineWidth = isSelected ? 2 : 1
      ctx.beginPath()
      ctx.roundRect(30, startY + i * 65, GAME_WIDTH - 60, 55, 6)
      ctx.fill()
      ctx.stroke()

      ctx.font = '20px sans-serif'
      ctx.textAlign = 'left'
      ctx.fillText(u.icon, 45, startY + i * 65 + 35)

      ctx.fillStyle = '#fff'
      ctx.font = '14px Orbitron'
      ctx.fillText(`${u.name}  Lv.${level}/${maxLevel}`, 80, startY + i * 65 + 25)

      // 进度条
      ctx.fillStyle = '#333'
      ctx.fillRect(80, startY + i * 65 + 32, 200, 6)
      ctx.fillStyle = '#00f0ff'
      ctx.fillRect(80, startY + i * 65 + 32, 200 * (level / maxLevel), 6)

      if (isMaxed) {
        ctx.fillStyle = '#00ff66'
        ctx.font = '12px Orbitron'
        ctx.textAlign = 'right'
        ctx.fillText('MAX', GAME_WIDTH - 45, startY + i * 65 + 35)
      } else {
        ctx.fillStyle = canAfford ? '#ffdd00' : '#ff4444'
        ctx.font = '12px Orbitron'
        ctx.textAlign = 'right'
        ctx.fillText(`💰 ${cost}`, GAME_WIDTH - 45, startY + i * 65 + 35)
      }
    }
  }

  _renderWeapons(ctx) {
    const weaponIds = Object.keys(weaponConfig)
    const startY = 150

    for (let i = 0; i < weaponIds.length; i++) {
      const wid = weaponIds[i]
      const config = weaponConfig[wid]
      const isUnlocked = this.save.unlockedWeapons.includes(wid)
      const isSelected = i === this.selectedIdx
      const cost = wid === 'main' ? 0 : 200

      ctx.fillStyle = isSelected ? 'rgba(0, 240, 255, 0.1)' : 'rgba(0,0,0,0.3)'
      ctx.strokeStyle = isSelected ? '#00f0ff' : '#444'
      ctx.lineWidth = isSelected ? 2 : 1
      ctx.beginPath()
      ctx.roundRect(30, startY + i * 55, GAME_WIDTH - 60, 45, 6)
      ctx.fill()
      ctx.stroke()

      ctx.fillStyle = isUnlocked ? '#0f0' : '#f00'
      ctx.textAlign = 'left'
      ctx.font = '14px Orbitron'
      ctx.fillText(isUnlocked ? '✅' : '🔒', 45, startY + i * 55 + 30)

      ctx.fillStyle = '#fff'
      ctx.font = '14px Orbitron'
      ctx.fillText(config.name, 80, startY + i * 55 + 30)

      if (!isUnlocked) {
        ctx.fillStyle = this.save.coins >= cost ? '#ffdd00' : '#ff4444'
        ctx.font = '12px Orbitron'
        ctx.textAlign = 'right'
        ctx.fillText(`💰 ${cost}`, GAME_WIDTH - 45, startY + i * 55 + 30)
      } else {
        ctx.fillStyle = '#00ff66'
        ctx.font = '12px Orbitron'
        ctx.textAlign = 'right'
        ctx.fillText('已解锁', GAME_WIDTH - 45, startY + i * 55 + 30)
      }
    }
  }

  _renderSkills(ctx) {
    const skillIds = Object.keys(skillConfig)
    const startY = 150

    for (let i = 0; i < skillIds.length; i++) {
      const sid = skillIds[i]
      const config = skillConfig[sid]
      const isUnlocked = this.save.unlockedSkills.includes(sid)
      const isEquipped = this.save.equippedSkills.includes(sid)
      const isSelected = i === this.selectedIdx
      const cost = 300

      ctx.fillStyle = isSelected ? 'rgba(0, 240, 255, 0.1)' : 'rgba(0,0,0,0.3)'
      ctx.strokeStyle = isSelected ? '#00f0ff' : '#444'
      ctx.lineWidth = isSelected ? 2 : 1
      ctx.beginPath()
      ctx.roundRect(30, startY + i * 55, GAME_WIDTH - 60, 45, 6)
      ctx.fill()
      ctx.stroke()

      ctx.textAlign = 'left'
      ctx.font = '16px sans-serif'
      ctx.fillText(isUnlocked ? (isEquipped ? '✅' : '⬜') : '🔒', 45, startY + i * 55 + 30)

      ctx.fillStyle = '#fff'
      ctx.font = '14px Orbitron'
      ctx.fillText(`${config.icon} ${config.name}`, 80, startY + i * 55 + 22)

      ctx.fillStyle = '#888'
      ctx.font = '9px Orbitron'
      ctx.fillText(config.description, 80, startY + i * 55 + 35)

      if (!isUnlocked) {
        ctx.fillStyle = this.save.coins >= cost ? '#ffdd00' : '#ff4444'
        ctx.font = '12px Orbitron'
        ctx.textAlign = 'right'
        ctx.fillText(`💰 ${cost}`, GAME_WIDTH - 45, startY + i * 55 + 30)
      } else if (isEquipped) {
        ctx.fillStyle = '#00ff66'
        ctx.font = '10px Orbitron'
        ctx.textAlign = 'right'
        ctx.fillText('已装备', GAME_WIDTH - 45, startY + i * 55 + 30)
      } else {
        ctx.fillStyle = '#888'
        ctx.font = '10px Orbitron'
        ctx.textAlign = 'right'
        ctx.fillText('点击装备', GAME_WIDTH - 45, startY + i * 55 + 30)
      }
    }
  }
}

// ==================== scenes/ResultScene.js ====================
// ==================== 结算场景 ====================

class ResultScene {
  constructor(game, params = {}) {
    this.game = game
    this.starField = new StarField(3)
    this.params = params
    this.victory = params.victory || false
    this.score = params.score || 0
    this.combo = params.combo || 0
    this.kills = params.kills || 0
    this.accuracy = params.accuracy || 0
    this.coins = params.coins || 0
    this.starRating = params.starRating || 1
    this.levelId = params.levelId || 1
    this.timer = 0
    this.showStats = false
  }

  init() {
    this.save = loadSave()
    this.timer = 0
    this.showStats = false

    // 保存最高分
    const prevHigh = this.save.highScores[this.levelId] || 0
    if (this.score > prevHigh) {
      this.save.highScores[this.levelId] = this.score
    }
    saveSave(this.save)
  }

  update(dt) {
    this.starField.update(dt)
    this.timer += dt

    if (this.timer > 0.5) {
      this.showStats = true
    }

    if (this.game.input.isKeyPressed('Enter') || this.game.input.isKeyPressed(' ') || this.game.input.isKeyPressed('click') || this.game.input.isKeyPressed('Escape')) {
      this.game.scenes.switchTo('menu')
    }
  }

  render(ctx) {
    this.starField.render(ctx)

    ctx.fillStyle = this.victory ? '#00ff66' : '#ff2244'
    ctx.font = 'bold 36px Orbitron'
    ctx.textAlign = 'center'
    const title = this.victory ? 'VICTORY!' : 'DEFEATED'
    ctx.fillText(title, GAME_WIDTH / 2, 80)

    if (!this.showStats) return

    // 星级
    const starY = 130
    for (let i = 0; i < 3; i++) {
      const filled = i < this.starRating
      ctx.fillStyle = filled ? '#ffdd00' : '#333'
      ctx.font = '40px sans-serif'
      ctx.fillText('★', GAME_WIDTH / 2 + (i - 1) * 50, starY)
    }

    // 统计数据
    const stats = [
      { label: '分数', value: this.score },
      { label: '最高连击', value: this.combo },
      { label: '击杀数', value: this.kills },
      { label: '命中率', value: `${Math.floor(this.accuracy * 100)}%` },
      { label: '金币', value: `+${this.coins}` },
    ]

    const startY = 200
    for (let i = 0; i < stats.length; i++) {
      const s = stats[i]
      ctx.fillStyle = '#888'
      ctx.font = '14px Orbitron'
      ctx.textAlign = 'left'
      ctx.fillText(s.label, GAME_WIDTH / 2 - 80, startY + i * 35)
      ctx.fillStyle = '#fff'
      ctx.font = 'bold 16px Orbitron'
      ctx.textAlign = 'right'
      ctx.fillText(String(s.value), GAME_WIDTH / 2 + 80, startY + i * 35)
    }

    // 分隔线
    ctx.strokeStyle = '#444'
    ctx.lineWidth = 1
    ctx.beginPath()
    ctx.moveTo(GAME_WIDTH / 2 - 100, startY + stats.length * 35 + 10)
    ctx.lineTo(GAME_WIDTH / 2 + 100, startY + stats.length * 35 + 10)
    ctx.stroke()

    // 提示
    ctx.fillStyle = '#aaa'
    ctx.font = '14px Orbitron'
    ctx.textAlign = 'center'
    ctx.fillText('按任意键返回菜单', GAME_WIDTH / 2, GAME_HEIGHT - 60)
  }
}

// ==================== scenes/BattleScene.js ====================
// ==================== 战斗场景 ====================

class BattleScene {
  constructor(game, params = {}) {
    this.game = game
    this.starField = new StarField(3)
    this.levelId = params.level || 1
    this.levelConfig = levels.find(l => l.id === this.levelId) || levels[0]

    this.save = loadSave()
    this.player = new Player(game, this.save)
    this.weaponSystem = new WeaponSystem(game)
    this.skillSystem = new SkillSystem(game)
    this.scoreSystem = new ScoreSystem()
    this.spawnSystem = new SpawnSystem(game)

    this.enemies = []
    this.playerBullets = []
    this.enemyBullets = []
    this.powerups = []
    this.boss = null
    this.damageNumbers = []

    this.bossDefeated = false
    this.bossSpawned = false
    this.gameOver = false
    this.paused = false
    this.levelTimer = 0
    this.autoAimActive = false

    this.quadTree = new QuadTree(0, 0, GAME_WIDTH, GAME_HEIGHT, 16)

    this._eventCallbacks = {}
    this._bindEvents()
  }

  _bindEvents() {
    const ev = this.game.events
    this._eventCallbacks = {
      player_bullet: (data) => {
        this.playerBullets.push(new Bullet(data))
        this.scoreSystem.addShot()
      },
      enemy_bullet: (data) => {
        this.enemyBullets.push(new Bullet(data))
      },
      spawn_enemy: (data) => {
        this.enemies.push(new Enemy(data.x, data.y, data.type, this.game))
      },
      spawn_boss: (data) => {
        this._spawnBoss(data.bossId)
      },
      enemy_killed: (data) => {
        const { enemy } = data
        const points = this.scoreSystem.addKill(enemy.score)
        this.damageNumbers.push({
          x: enemy.x, y: enemy.y, value: `+${points}`,
          life: 1, maxLife: 1, color: '#ffdd00',
        })
        this._dropPowerups(enemy)
      },
      boss_killed: (data) => {
        this.bossDefeated = true
        this.scoreSystem.score += 500
        this.save.coins += 500
        if (this.save.maxLevelUnlocked <= this.levelId) {
          this.save.maxLevelUnlocked = this.levelId + 1
        }
        if (this.levelId >= 3 && !this.save.unlockedWeapons.includes('plasma')) {
          this.save.unlockedWeapons.push('plasma')
        }
        saveSave(this.save)
      },
      player_death: () => {
        this.gameOver = true
      },
      skill_used: (data) => {
        this.skillSystem.useSkill(data.skillId, this.player)
      },
      clear_screen: (data) => {
        this._clearScreen(data.bossDamage)
      },
      boss_summon: (data) => {
        for (let i = 0; i < data.count; i++) {
          const x = 50 + Math.random() * (GAME_WIDTH - 100)
          this.enemies.push(new Enemy(x, -20, data.type, this.game))
        }
      },
      damage_number: (data) => {
        this.damageNumbers.push({
          ...data,
          life: 0.8,
          maxLife: 0.8,
          color: '#ff4444',
        })
      },
    }
    for (const [name, cb] of Object.entries(this._eventCallbacks)) {
      ev.on(name, cb)
    }
  }

  init() {
    this.player.init()
    this.game.player = this.player
    this.scoreSystem.init()
    this.spawnSystem.init(this.levelConfig.waves, this.levelConfig.duration)
    this.game.camera.reset()
    this.game.particles.clear()
    this.game.timeScale = 1

    this.enemies = []
    this.playerBullets = []
    this.enemyBullets = []
    this.powerups = []
    this.boss = null
    this.bossDefeated = false
    this.bossSpawned = false
    this.gameOver = false
    this.paused = false
    this.levelTimer = 0
    this.damageNumbers = []
  }

  destroy() {
    this.game.player = null
    // 移除本场景注册的事件监听器
    const ev = this.game.events
    for (const [name, cb] of Object.entries(this._eventCallbacks)) {
      ev.off(name, cb)
    }
  }

  _spawnBoss(bossId) {
    if (this.bossSpawned) return
    this.bossSpawned = true
    if (bossId === 'titan_x') {
      this.boss = new Boss(this.game, {
        id: 'titan_x',
        name: 'Titan-X',
        hp: 5000,
        score: 500,
        size: { w: 220, h: 130 },
        color: '#ff2244',
        phases: [1, 2, 3],
      })
      this.boss.init()
    }
  }

  _clearScreen(bossDamage) {
    // 清除所有敌机子弹
    this.enemyBullets.forEach(b => { b.active = false })
    this.enemyBullets = []

    // 清除所有敌机
    for (const enemy of this.enemies) {
      enemy.active = false
      this.game.particles.emitExplosion(enemy.x, enemy.y, 15)
    }
    this.enemies = []

    // BOSS 伤害
    if (this.boss && this.boss.active) {
      this.boss.takeDamage(bossDamage)
    }

    // 全屏闪光
    this._screenFlash = 0.3
  }

  _dropPowerups(enemy) {
    const drops = enemy.getDrop()
    for (const drop of drops) {
      this.powerups.push(new PowerUp(enemy.x, enemy.y, drop.type))
    }
  }

  _checkBossSpawn() {
    if (!this.bossSpawned && this.levelConfig.bossId) {
      // 当所有敌机波次都完成时，生成 BOSS
      if (this.spawnSystem.waveIndex >= this.spawnSystem.waves.length &&
          this.spawnSystem.spawnCount <= 0 &&
          this.enemies.length === 0) {
        this.spawnSystem.spawnBoss(this.levelConfig.bossId)
      }
    }
  }

  update(dt) {
    // 技能快捷键
    if (!this.gameOver && !this.game.paused) {
      for (let i = 0; i < 3; i++) {
        if (this.game.input.isKeyPressed(String(i + 1))) {
          if (i < this.player.skills.length) {
            const skillId = this.player.skills[i]
            if (this.skillSystem.getCooldown(skillId) <= 0) {
              this.skillSystem.useSkill(skillId, this.player)
            }
          }
        }
      }
    }

    if (this.paused || this.gameOver) {
      this.starField.update(dt)
      return
    }

    this.starField.update(dt)
    this.levelTimer += dt

    // 更新玩家
    this.player.update(dt)

    // 更新生成系统
    this.spawnSystem.update(dt)

    // 检查 BOSS 生成
    if (!this.bossSpawned && this.enemies.length === 0) {
      this._checkBossSpawn()
    }

    // 更新技能系统
    this.skillSystem.update(dt)
    this.autoAimActive = this.skillSystem.isAutoAimActive()

    // 更新敌机
    for (const enemy of this.enemies) {
      if (enemy.active) enemy.update(dt)
    }
    this.enemies = this.enemies.filter(e => e.active)

    // 更新 BOSS
    if (this.boss && this.boss.active) {
      this.boss.update(dt)
    }

    // 更新子弹
    for (const bullet of this.playerBullets) {
      if (bullet.active) {
        if (this.autoAimActive && !bullet.tracking) {
          bullet.tracking = true
          const nearest = this._findNearestEnemy(bullet)
          if (nearest) bullet.trackingTarget = nearest
        }
        bullet.update(dt)
      }
    }
    this.playerBullets = this.playerBullets.filter(b => b.active)

    for (const bullet of this.enemyBullets) {
      if (bullet.active) bullet.update(dt)
    }
    this.enemyBullets = this.enemyBullets.filter(b => b.active)

    // 更新道具
    for (const powerup of this.powerups) {
      if (powerup.active) powerup.update(dt, this.player)
    }
    this.powerups = this.powerups.filter(p => p.active)

    // 更新伤害数字
    for (const dn of this.damageNumbers) {
      dn.life -= dt
      dn.y -= 30 * dt
    }
    this.damageNumbers = this.damageNumbers.filter(d => d.life > 0)

    // 屏幕闪光
    if (this._screenFlash > 0) this._screenFlash -= dt

    // 碰撞检测
    this._checkCollisions()

    // 分数更新
    this.scoreSystem.update(dt)

    // 检查战斗结束
    if (this.bossDefeated && this.spawnSystem.waveIndex >= this.spawnSystem.waves.length) {
      this._onVictory()
    }
    // 无尽模式检查
    const isEndless = this.levelConfig.endless
    if (!isEndless && this.spawnSystem.finished && this.enemies.length === 0 && !this.boss && !this.bossDefeated) {
      this._onVictory()
    }
  }

  _findNearestEnemy(bullet) {
    let nearest = null
    let minDist = Infinity
    for (const enemy of this.enemies) {
      if (!enemy.active) continue
      const d = distance(bullet, enemy)
      if (d < minDist) {
        minDist = d
        nearest = enemy
      }
    }
    if (this.boss && this.boss.active) {
      const d = distance(bullet, this.boss)
      if (d < minDist) {
        minDist = d
        nearest = this.boss
      }
    }
    return nearest
  }

  _checkCollisions() {
    // 玩家子弹 vs 敌机
    for (const bullet of this.playerBullets) {
      if (!bullet.active) continue

      // 检查 BOSS
      if (this.boss && this.boss.active && !this.boss.entering) {
        if (CollisionDetector.aabb(bullet.bounds, this.boss.bounds)) {
          this.boss.takeDamage(bullet.damage)
          this.scoreSystem.addHit()
          if (!bullet.pierce) {
            bullet.active = false
          }
          this.game.particles.emit(bullet.x, bullet.y, 3, {
            speed: 2, life: 0.2, color: bullet.color, size: 2,
          })
          continue
        }
      }

      for (const enemy of this.enemies) {
        if (!enemy.active) continue
        if (CollisionDetector.aabb(bullet.bounds, enemy.bounds)) {
          enemy.takeDamage(bullet.damage)
          this.scoreSystem.addHit()
          if (!bullet.pierce) {
            bullet.active = false
          }
          this.game.particles.emit(bullet.x, bullet.y, 2, {
            speed: 1.5, life: 0.15, color: bullet.color, size: 2,
          })
          break
        }
      }
    }

    // 敌方子弹 / 敌机 vs 玩家
    if (this.player.alive) {
      for (const bullet of this.enemyBullets) {
        if (!bullet.active) continue
        if (CollisionDetector.aabb(bullet.bounds, this.player.bounds)) {
          if (!this.skillSystem.isInvincible()) {
            this.player.takeDamage(bullet.damage)
          }
          bullet.active = false
          this.game.particles.emit(bullet.x, bullet.y, 5, {
            speed: 3, life: 0.3, color: '#ff4444', size: 3,
          })
        }
      }

      for (const enemy of this.enemies) {
        if (!enemy.active) continue
        if (CollisionDetector.aabb(enemy.bounds, this.player.bounds)) {
          if (enemy.explosionRadius > 0) {
            // 自爆机
            enemy.takeDamage(enemy.hp) // 自爆
            this.game.particles.emitExplosion(enemy.x, enemy.y, enemy.explosionRadius * 0.6)
          }
          if (!this.skillSystem.isInvincible()) {
            this.player.takeDamage(enemy.explosionDamage || 1)
          }
        }
      }

      // BOSS 激光（碰触检测属于 BOSS 渲染逻辑）
      // 简化：BOSS 激光在 BOSS 更新时独立处理
      if (this.boss && this.boss.active && !this.boss.entering) {
        if (this.boss._isLaserActive) {
          if (!this.skillSystem.isInvincible()) {
            this.player.takeDamage(0.05) // 激光持续伤害
          }
        }
      }
    }

    // 道具 vs 玩家
    if (this.player.alive) {
      for (const powerup of this.powerups) {
        if (!powerup.active) continue
        if (CollisionDetector.aabb(powerup.bounds, this.player.bounds)) {
          this._applyPowerup(powerup)
          powerup.active = false
        }
      }
    }
  }

  _applyPowerup(powerup) {
    switch (powerup.effect) {
      case 'addCoin':
        this.scoreSystem.addCoins(powerup.value)
        this.save.coins += powerup.value
        break
      case 'heal':
        this.player.heal(powerup.value)
        break
      case 'addShield':
        this.player.addShield(powerup.value)
        break
      case 'upgradeWeapon':
        this.player.upgradeWeapon()
        break
      case 'addBomb':
        this.skillSystem.useSkill('bomb', this.player)
        break
      case 'addShard':
        // 技能碎片 - 随机解锁技能
        const allSkills = Object.keys(skillConfig)
        const locked = allSkills.filter(s => !this.save.unlockedSkills.includes(s))
        if (locked.length > 0) {
          const newSkill = locked[Math.floor(Math.random() * locked.length)]
          this.save.unlockedSkills.push(newSkill)
          if (this.save.equippedSkills.length < 3) {
            this.save.equippedSkills.push(newSkill)
            this.player.skills = [...this.save.equippedSkills]
            this.player.skillCooldowns[newSkill] = 0
          }
        }
        break
    }
    saveSave(this.save)
  }

  _onVictory() {
    this.gameOver = true
    setTimeout(() => {
      this.game.scenes.switchTo('result', {
        levelId: this.levelId,
        score: this.scoreSystem.score,
        combo: this.scoreSystem.maxCombo,
        kills: this.scoreSystem.killCount,
        accuracy: this.scoreSystem.accuracy,
        coins: this.scoreSystem.coinsCollected,
        starRating: this.scoreSystem.getStarRating(),
        victory: true,
      })
    }, 1500)
  }

  render(ctx) {
    this.starField.render(ctx)

    // 渲染道具
    for (const powerup of this.powerups) {
      if (powerup.active) powerup.render(ctx)
    }

    // 渲染敌机
    for (const enemy of this.enemies) {
      if (enemy.active) enemy.render(ctx)
    }

    // 渲染 BOSS
    if (this.boss && this.boss.active) {
      this.boss.render(ctx)
    }

    // 渲染玩家
    this.player.render(ctx)

    // 渲染子弹
    for (const bullet of this.playerBullets) {
      if (bullet.active) bullet.render(ctx)
    }
    for (const bullet of this.enemyBullets) {
      if (bullet.active) bullet.render(ctx)
    }

    // 渲染伤害数字
    for (const dn of this.damageNumbers) {
      const alpha = dn.life / dn.maxLife
      ctx.globalAlpha = alpha
      ctx.fillStyle = dn.color
      ctx.font = 'bold 14px Orbitron'
      ctx.textAlign = 'center'
      ctx.fillText(String(dn.value), dn.x, dn.y)
      ctx.globalAlpha = 1
    }

    // 屏幕闪光
    if (this._screenFlash > 0) {
      ctx.fillStyle = `rgba(255,255,255,${this._screenFlash * 0.5})`
      ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT)
    }

    // HUD
    this._renderHUD(ctx)

    // BOSS 血条（在 HUD 之上）
    if (this.boss && this.boss.active && !this.boss.entering) {
      this._renderBossHpBar(ctx)
    }

    // 游戏结束
    if (this.gameOver && !this.bossDefeated) {
      this._renderGameOver(ctx)
    }
  }

  _renderHUD(ctx) {
    const p = this.player

    // 血量条
    const barX = 15
    const barY = 15
    const barW = 120
    const barH = 10
    ctx.fillStyle = '#333'
    ctx.fillRect(barX, barY, barW, barH)
    ctx.fillStyle = p.hp / p.maxHp > 0.3 ? '#00ff66' : '#ff2244'
    ctx.fillRect(barX, barY, barW * (p.hp / p.maxHp), barH)
    ctx.strokeStyle = '#ffffff'
    ctx.lineWidth = 1
    ctx.strokeRect(barX, barY, barW, barH)
    ctx.fillStyle = '#fff'
    ctx.font = '10px Orbitron'
    ctx.textAlign = 'left'
    ctx.fillText(`HP ${p.hp}/${p.maxHp}`, barX, barY + 22)

    // 护盾
    if (p.shield > 0) {
      ctx.fillStyle = 'rgba(85, 170, 255, 0.8)'
      ctx.fillRect(barX, barY - 8, barW * (p.shield / p.maxShield), 6)
    }

    // 分数
    ctx.fillStyle = '#ffdd00'
    ctx.font = 'bold 18px Orbitron'
    ctx.textAlign = 'right'
    ctx.fillText(`${this.scoreSystem.score}`, GAME_WIDTH - 15, 30)

    // 连击
    if (this.scoreSystem.combo > 1) {
      ctx.fillStyle = '#ff8844'
      ctx.font = 'bold 14px Orbitron'
      ctx.fillText(`COMBO x${this.scoreSystem.combo}`, GAME_WIDTH - 15, 50)
    }

    // 武器等级
    ctx.fillStyle = '#00f0ff'
    ctx.font = '12px Orbitron'
    ctx.textAlign = 'left'
    ctx.fillText(`Lv.${p.weaponLevel}`, barX, barY + 38)

    // 技能图标
    const skillBarY = GAME_HEIGHT - 50
    for (let i = 0; i < Math.min(p.skills.length, 3); i++) {
      const skillId = p.skills[i]
      const config = skillConfig[skillId]
      if (!config) continue

      const sx = GAME_WIDTH / 2 + (i - 1) * 60
      const cdPercent = this.skillSystem.getCooldownPercent(skillId)

      // 技能框
      ctx.fillStyle = cdPercent > 0 ? '#333' : '#1a2a3a'
      ctx.strokeStyle = config.color
      ctx.lineWidth = 2
      ctx.beginPath()
      ctx.roundRect(sx - 20, skillBarY, 40, 40, 6)
      ctx.fill()
      ctx.stroke()

      // 冷却遮罩
      if (cdPercent > 0) {
        ctx.fillStyle = 'rgba(0,0,0,0.6)'
        ctx.beginPath()
        ctx.roundRect(sx - 20, skillBarY, 40, 40 * cdPercent, 6)
        ctx.fill()
        ctx.fillStyle = '#fff'
        ctx.font = 'bold 12px Orbitron'
        ctx.textAlign = 'center'
        ctx.fillText(`${Math.ceil(this.skillSystem.getCooldown(skillId))}`, sx, skillBarY + 25)
      }

      // 技能名
      ctx.fillStyle = config.color
      ctx.font = '16px sans-serif'
      ctx.textAlign = 'center'
      ctx.fillText(config.icon, sx, skillBarY + 28)

      ctx.fillStyle = '#aaa'
      ctx.font = '9px Orbitron'
      ctx.fillText(`${i + 1}`, sx, skillBarY + 48)
    }

    // 关卡信息
    ctx.fillStyle = '#666'
    ctx.font = '10px Orbitron'
    ctx.textAlign = 'center'
    ctx.fillText(`Level ${this.levelId}`, GAME_WIDTH / 2, 30)
    ctx.fillText(`${this.levelConfig.name}`, GAME_WIDTH / 2, 42)
  }

  _renderGameOver(ctx) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)'
    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT)

    ctx.fillStyle = '#ff2244'
    ctx.font = 'bold 40px Orbitron'
    ctx.textAlign = 'center'
    ctx.fillText('GAME OVER', GAME_WIDTH / 2, GAME_HEIGHT / 2 - 30)

    ctx.fillStyle = '#ffffff'
    ctx.font = '18px Orbitron'
    ctx.fillText(`Score: ${this.scoreSystem.score}`, GAME_WIDTH / 2, GAME_HEIGHT / 2 + 20)

    ctx.fillStyle = '#aaa'
    ctx.font = '14px Orbitron'
    ctx.fillText('按 ESC 返回菜单', GAME_WIDTH / 2, GAME_HEIGHT / 2 + 60)

    // 返回菜单
    if (this.game.input.isKeyPressed('Escape')) {
      this.game.scenes.switchTo('menu')
    }
  }

  _renderBossHpBar(ctx) {
    const boss = this.boss
    const barWidth = 300
    const barHeight = 14
    const barX = GAME_WIDTH / 2 - barWidth / 2
    const barY = 55
    const hpPercent = boss.hp / boss.maxHp

    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)'
    ctx.fillRect(barX - 2, barY - 2, barWidth + 4, barHeight + 4)
    ctx.fillStyle = '#333'
    ctx.fillRect(barX, barY, barWidth, barHeight)

    const hpGrad = ctx.createLinearGradient(barX, barY, barX + barWidth, barY)
    if (hpPercent > 0.6) {
      hpGrad.addColorStop(0, '#ff2244')
      hpGrad.addColorStop(1, '#ff6644')
    } else if (hpPercent > 0.3) {
      hpGrad.addColorStop(0, '#ff6622')
      hpGrad.addColorStop(1, '#ffaa00')
    } else {
      hpGrad.addColorStop(0, '#ff0000')
      hpGrad.addColorStop(1, '#ff4400')
    }
    ctx.fillStyle = hpGrad
    ctx.fillRect(barX, barY, barWidth * hpPercent, barHeight)

    ctx.strokeStyle = '#ffffff'
    ctx.lineWidth = 2
    ctx.strokeRect(barX, barY, barWidth, barHeight)

    if (boss._shieldActive) {
      const shieldPercent = boss._shieldHp / 200
      ctx.fillStyle = 'rgba(255, 200, 0, 0.8)'
      ctx.fillRect(barX, barY - 8, barWidth * shieldPercent, 6)
      ctx.strokeStyle = 'rgba(255, 200, 0, 0.8)'
      ctx.lineWidth = 1
      ctx.strokeRect(barX, barY - 8, barWidth, 6)
    }

    ctx.fillStyle = '#ffffff'
    ctx.font = 'bold 12px Orbitron'
    ctx.textAlign = 'center'
    ctx.fillText(`Titan-X  Phase ${boss.currentPhase + 1}/3`, GAME_WIDTH / 2, barY - 14)
    ctx.fillStyle = '#ffdd00'
    ctx.font = 'bold 12px Orbitron'
    ctx.fillText(`${Math.ceil(boss.hp)} / ${boss.maxHp}`, GAME_WIDTH / 2, barY + barHeight + 14)
  }
}

// ==================== 启动 ====================
(function() {
  const canvas = document.getElementById('gameCanvas')
  const ctx = canvas.getContext('2d')

  window.addEventListener('error', function(e) {
    try {
      ctx.fillStyle = '#0a0a1a'
      ctx.fillRect(0, 0, canvas.width, canvas.height)
      ctx.fillStyle = '#ff2244'
      ctx.font = 'bold 16px sans-serif'
      ctx.textAlign = 'center'
      ctx.fillText('游戏出错:', canvas.width / 2, canvas.height / 2 - 20)
      ctx.fillStyle = '#ffdd00'
      ctx.font = '12px sans-serif'
      ctx.fillText(e.message || String(e.error), canvas.width / 2, canvas.height / 2 + 10)
      ctx.fillText('请刷新页面重试', canvas.width / 2, canvas.height / 2 + 30)
    } catch(_) {}
  })

  async function bootstrap() {
    try {
      const game = new Game(canvas)
      await game.init()
      game.start()
    } catch (err) {
      ctx.fillStyle = '#0a0a1a'
      ctx.fillRect(0, 0, canvas.width, canvas.height)
      ctx.fillStyle = '#ff2244'
      ctx.font = 'bold 16px sans-serif'
      ctx.textAlign = 'center'
      ctx.fillText('启动失败:', canvas.width / 2, canvas.height / 2 - 20)
      ctx.fillStyle = '#ffdd00'
      ctx.font = '12px sans-serif'
      ctx.fillText(err.message || String(err), canvas.width / 2, canvas.height / 2 + 10)
      ctx.fillText('请刷新页面重试', canvas.width / 2, canvas.height / 2 + 30)
      console.error('Bootstrap failed:', err)
    }
  }

  bootstrap()
})()

</script>
