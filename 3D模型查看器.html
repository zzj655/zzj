<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D模型查看器 - 街头摄影</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #1a1a2e; font-family: 'Microsoft YaHei', sans-serif; }
  canvas { display: block; }
  #info {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.7); font-size: 14px;
    background: rgba(0,0,0,0.5); padding: 8px 20px; border-radius: 20px;
    pointer-events: none; z-index: 10;
  }
  #dropzone {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; z-index: 20;
    background: rgba(26,26,46,0.95); transition: opacity 0.3s;
  }
  #dropzone.hidden { opacity: 0; pointer-events: none; }
  #dropzone h2 { color: #fff; font-size: 24px; margin-bottom: 10px; }
  #dropzone p { color: rgba(255,255,255,0.6); font-size: 14px; margin-bottom: 20px; }
  #dropzone button {
    background: #4a6cf7; color: #fff; border: none; padding: 12px 30px;
    font-size: 16px; border-radius: 25px; cursor: pointer;
  }
  #dropzone button:hover { background: #5b7bf8; }
  #dropzone.drag-over { background: rgba(74,108,247,0.3); }
  #loading {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    color: #fff; font-size: 18px; z-index: 15; display: none;
  }
</style>
</head>
<body>
<div id="dropzone">
  <h2>将 GLB 文件拖拽到此处</h2>
  <p>或点击下方按钮选择文件</p>
  <button id="fileBtn">选择 GLB 文件</button>
  <input type="file" id="fileInput" accept=".glb,.gltf" style="display:none">
</div>
<div id="loading">加载模型中...</div>
<div id="info">鼠标左键旋转 | 滚轮缩放 | 右键平移</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
scene.fog = new THREE.Fog(0x1a1a2e, 5, 30);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(3, 2, 5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

// 光照
scene.add(new THREE.AmbientLight(0xffffff, 0.6));

const mainLight = new THREE.DirectionalLight(0xffffff, 2);
mainLight.position.set(5, 10, 5);
mainLight.castShadow = true;
mainLight.shadow.mapSize.width = 2048;
mainLight.shadow.mapSize.height = 2048;
mainLight.shadow.camera.near = 0.5;
mainLight.shadow.camera.far = 50;
mainLight.shadow.camera.left = -10;
mainLight.shadow.camera.right = 10;
mainLight.shadow.camera.top = 10;
mainLight.shadow.camera.bottom = -10;
scene.add(mainLight);

const fillLight = new THREE.DirectionalLight(0x8899ff, 0.8);
fillLight.position.set(-3, 1, -3);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xffffff, 0.5);
rimLight.position.set(0, -1, 3);
scene.add(rimLight);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(20, 20),
  new THREE.ShadowMaterial({ opacity: 0.3 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// 控制器
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 1, 0);
controls.minDistance = 1;
controls.maxDistance = 10;
controls.maxPolarAngle = Math.PI * 0.7;
controls.update();

// 模型加载函数
const loader = new GLTFLoader();
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
loader.setDRACOLoader(dracoLoader);

let currentModel = null;

function loadModel(url) {
  const dropzone = document.getElementById('dropzone');
  const loading = document.getElementById('loading');
  loading.style.display = 'block';

  loader.load(url, (gltf) => {
    loading.style.display = 'none';
    dropzone.classList.add('hidden');
    
    if (currentModel) scene.remove(currentModel);
    currentModel = gltf.scene;
    
    const box = new THREE.Box3().setFromObject(currentModel);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    const scale = 3 / maxDim;
    
    currentModel.scale.setScalar(scale);
    currentModel.position.set(-center.x * scale, -center.y * scale + 0.5, -center.z * scale);
    
    currentModel.traverse((node) => {
      if (node.isMesh) {
        node.castShadow = true;
        node.receiveShadow = true;
      }
    });
    
    scene.add(currentModel);
    controls.target.set(0, 1, 0);
    controls.update();
  }, (progress) => {
    if (progress.total > 0) {
      const pct = Math.round((progress.loaded / progress.total) * 100);
      loading.textContent = `加载中... ${pct}%`;
    }
  }, (error) => {
    loading.textContent = '加载失败: ' + error.message;
    console.error(error);
  });
}

// 文件选择
const fileInput = document.getElementById('fileInput');
document.getElementById('fileBtn').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (file) loadModel(URL.createObjectURL(file));
});

// 拖拽
const dropzone = document.getElementById('dropzone');
dropzone.addEventListener('dragover', (e) => {
  e.preventDefault();
  dropzone.classList.add('drag-over');
});
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-over'));
dropzone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropzone.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file && (file.name.endsWith('.glb') || file.name.endsWith('.gltf'))) {
    loadModel(URL.createObjectURL(file));
  }
});

// 也允许在页面任意位置拖拽
document.body.addEventListener('dragover', (e) => e.preventDefault());
document.body.addEventListener('drop', (e) => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (file && (file.name.endsWith('.glb') || file.name.endsWith('.gltf'))) {
    loadModel(URL.createObjectURL(file));
  }
});

// 动画循环
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
